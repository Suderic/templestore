    <path d="M36 223 L39 226 L45 220" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="222" fill="#ffffff" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Wake Up Early</text>
