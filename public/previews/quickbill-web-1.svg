      <line x1="24" y1="0" x2="24" y2="28" stroke="#0f172a" stroke-width="4"/>
      <line x1="32" y1="0" x2="32" y2="28" stroke="#0f172a" stroke-width="1"/>
      <line x1="36" y1="0" x2="36" y2="28" stroke="#0f172a" stroke-width="2"/>
      <line x1="42" y1="0" x2="42" y2="28" stroke="#0f172a" stroke-width="3"/>
      <line x1="48" y1="0" x2="48" y2="28" stroke="#0f172a" stroke-width="1"/>
      <line x1="52" y1="0" x2="52" y2="28" stroke="#0f172a" stroke-width="2"/>
      <line x1="58" y1="0" x2="58" y2="28" stroke="#0f172a" stroke-width="1"/>
      <line x1="62" y1="0" x2="62" y2="28" stroke="#0f172a" stroke-width="3"/>
      <line x1="68" y1="0" x2="68" y2="28" stroke="#0f172a" stroke-width="2"/>
      <line x1="74" y1="0" x2="74" y2="28" stroke="#0f172a" stroke-width="4"/>
      <line x1="82" y1="0" x2="82" y2="28" stroke="#0f172a" stroke-width="1"/>
      <line x1="86" y1="0" x2="86" y2="28" stroke="#0f172a" stroke-width="2"/>
      <line x1="92" y1="0" x2="92" y2="28" stroke="#0f172a" stroke-width="3"/>
      <line x1="98" y1="0" x2="98" y2="28" stroke="#0f172a" stroke-width="1"/>
      <line x1="102" y1="0" x2="102" y2="28" stroke="#0f172a" stroke-width="2"/>
      <line x1="108" y1="0" x2="108" y2="28" stroke="#0f172a" stroke-width="4"/>
