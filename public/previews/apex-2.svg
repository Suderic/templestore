<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#090d16"/>
  
  <!-- Left Product Imagery -->
  <rect x="50" y="50" width="340" height="400" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)"/>
  <circle cx="220" cy="230" r="80" fill="rgba(99, 102, 241, 0.25)"/>
