<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120D"/>
      <stop offset="45%" stop-color="#0F2B22"/>
      <stop offset="100%" stop-color="#0B241C"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#3E7A5C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3E7A5C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="85%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#D98F4A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#D98F4A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberButton" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D98F4A"/>
      <stop offset="50%" stop-color="#E29D5D"/>
      <stop offset="100%" stop-color="#D98F4A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  <rect width="1200" height="750" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="750" fill="url(#amberGlow)"/>

  <!-- Website Top Navbar -->
  <rect x="0" y="0" width="1200" height="72" fill="#0F2B22" fill-opacity="0.9" stroke="rgba(245, 239, 227, 0.1)" stroke-width="1"/>
  
  <!-- Logo -->
  <rect x="48" y="16" width="40" height="40" rx="12" fill="#164031" stroke="#D98F4A" stroke-opacity="0.5"/>
  <path d="M68 24 L60 38 L65 38 L58 48 L78 48 L71 38 L76 38 Z" fill="#D98F4A"/>
  <text x="100" y="38" fill="#F5EFE3" font-size="20" font-family="Georgia, serif" font-weight="600">Alder &amp; Ash</text>
  <text x="100" y="50" fill="#E8DCC3" fill-opacity="0.6" font-size="9" font-family="system-ui, sans-serif" font-weight="600" letter-spacing="2">CASCADE FOREST RETREAT</text>

  <!-- Nav links -->
  <rect x="420" y="18" width="360" height="36" rx="18" fill="rgba(245, 239, 227, 0.05)" stroke="rgba(245, 239, 227, 0.08)"/>
  <rect x="426" y="22" width="60" height="28" rx="14" fill="rgba(245, 239, 227, 0.15)"/>
  <text x="456" y="40" fill="#F5EFE3" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Home</text>
  <text x="520" y="40" fill="#E8DCC3" fill-opacity="0.75" font-size="12" font-family="system-ui, sans-serif" font-weight="500">Rooms</text>
  <text x="580" y="40" fill="#E8DCC3" fill-opacity="0.75" font-size="12" font-family="system-ui, sans-serif" font-weight="500">Dining</text>
  <text x="645" y="40" fill="#E8DCC3" fill-opacity="0.75" font-size="12" font-family="system-ui, sans-serif" font-weight="500">Experiences</text>
  <text x="735" y="40" fill="#E8DCC3" fill-opacity="0.75" font-size="12" font-family="system-ui, sans-serif" font-weight="500">FAQ</text>

  <!-- Header Book CTA -->
  <rect x="1020" y="18" width="132" height="36" rx="18" fill="url(#amberButton)"/>
  <text x="1086" y="40" fill="#140D04" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Book Your Stay</text>

  <!-- Hero Section -->
  <!-- Tag -->
  <text x="600" y="150" fill="#D98F4A" font-size="11" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="3" text-anchor="middle">SOMEWHERE IN THE CASCADE FOOTHILLS</text>

  <!-- Main Headline -->
  <text x="600" y="215" fill="#F5EFE3" font-size="52" font-family="Georgia, serif" font-weight="500" text-anchor="middle" letter-spacing="-1">Slow down, the forest</text>
  <text x="600" y="275" fill="#D98F4A" font-size="52" font-family="Georgia, serif" font-style="italic" font-weight="400" text-anchor="middle">waited for you.</text>

  <!-- Subheadline -->
  <text x="600" y="325" fill="#E8DCC3" fill-opacity="0.8" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">Alder &amp; Ash is a 40-cabin retreat built into old-growth pine, with wood-fired cedar baths,</text>
  <text x="600" y="350" fill="#E8DCC3" fill-opacity="0.8" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">a river-fed pool, and nothing on the agenda but rest.</text>

  <!-- Hero Action Buttons -->
  <rect x="420" y="390" width="200" height="46" rx="23" fill="url(#amberButton)"/>
  <text x="520" y="418" fill="#140D04" font-size="13" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Check Availability &amp; Rates</text>

  <rect x="635" y="390" width="180" height="46" rx="23" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(245, 239, 227, 0.25)"/>
  <text x="725" y="418" fill="#F5EFE3" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">See Guided Experiences</text>

  <!-- Feature Cards / Badges Grid -->
  <g transform="translate(100, 480)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="225" height="110" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(245, 239, 227, 0.12)"/>
    <circle cx="35" cy="35" r="16" fill="rgba(217, 143, 74, 0.15)"/>
    <text x="35" y="40" fill="#D98F4A" font-size="14" text-anchor="middle">🌲</text>
    <text x="65" y="38" fill="#F5EFE3" font-size="14" font-family="system-ui, sans-serif" font-weight="700">40 Cabins</text>
    <text x="20" y="70" fill="#E8DCC3" fill-opacity="0.65" font-size="11" font-family="system-ui, sans-serif">Scattered across 120 secluded forest acres.</text>

    <!-- Card 2 -->
    <rect x="255" y="0" width="225" height="110" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(245, 239, 227, 0.12)"/>
    <circle cx="290" cy="35" r="16" fill="rgba(217, 143, 74, 0.15)"/>
    <text x="290" y="40" fill="#D98F4A" font-size="14" text-anchor="middle">♨️</text>
    <text x="320" y="38" fill="#F5EFE3" font-size="14" font-family="system-ui, sans-serif" font-weight="700">Cedar Baths</text>
    <text x="275" y="70" fill="#E8DCC3" fill-opacity="0.65" font-size="11" font-family="system-ui, sans-serif">Naturally heated spring soaking pools.</text>

    <!-- Card 3 -->
    <rect x="510" y="0" width="225" height="110" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(245, 239, 227, 0.12)"/>
    <circle cx="545" cy="35" r="16" fill="rgba(217, 143, 74, 0.15)"/>
    <text x="545" y="40" fill="#D98F4A" font-size="14" text-anchor="middle">🔥</text>
    <text x="575" y="38" fill="#F5EFE3" font-size="14" font-family="system-ui, sans-serif" font-weight="700">Hearth Dining</text>
    <text x="530" y="70" fill="#E8DCC3" fill-opacity="0.65" font-size="11" font-family="system-ui, sans-serif">Hyper-local wood-fired seasonal menus.</text>

    <!-- Card 4 -->
    <rect x="765" y="0" width="225" height="110" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(245, 239, 227, 0.12)"/>
    <circle cx="800" cy="35" r="16" fill="rgba(217, 143, 74, 0.15)"/>
    <text x="800" y="40" fill="#D98F4A" font-size="14" text-anchor="middle">⭐</text>
    <text x="830" y="38" fill="#F5EFE3" font-size="14" font-family="system-ui, sans-serif" font-weight="700">4.98 Rating</text>
    <text x="785" y="70" fill="#E8DCC3" fill-opacity="0.65" font-size="11" font-family="system-ui, sans-serif">Rated #1 Eco-Lodge in the Pacific NW.</text>
  </g>

  <!-- Bottom Website Section Teaser -->
  <rect x="0" y="620" width="1200" height="130" fill="#081812" stroke="rgba(245, 239, 227, 0.08)" stroke-width="1"/>
  <text x="60" y="655" fill="#D98F4A" font-size="10" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="2">CURATED CABINS &amp; SUITES</text>
  <text x="60" y="685" fill="#F5EFE3" font-size="20" font-family="Georgia, serif">Find your quiet in the forest canopy</text>
  <rect x="1000" y="645" width="140" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(245, 239, 227, 0.2)"/>
  <text x="1070" y="667" fill="#F5EFE3" font-size="11" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">View All 8 Cabins →</text>
</svg>
