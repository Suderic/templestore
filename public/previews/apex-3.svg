<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#090d16"/>
  
  <!-- Slide-out Cart Drawer Simulation -->
  <rect x="180" y="40" width="440" height="420" rx="20" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255, 255, 255, 0.15)"/>
  <text x="210" y="85" fill="white" font-size="20" font-weight="900" font-family="system-ui">Shopping Cart (1)</text>

  <rect x="210" y="115" width="380" height="90" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)"/>
  <rect x="225" y="130" width="60" height="60" rx="8" fill="rgba(99, 102, 241, 0.2)"/>
  <text x="300" y="152" fill="white" font-size="13" font-weight="bold" font-family="system-ui">Stealth Modular Parka</text>
  <text x="300" y="172" fill="rgba(255, 255, 255, 0.5)" font-size="11" font-family="system-ui">Size: M | Color: Obsidian</text>
  <text x="300" y="192" fill="#a5b4fc" font-size="13" font-weight="bold" font-family="system-ui">$280</text>

  <line x1="210" y1="240" x2="590" y2="240" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="210" y="270" fill="rgba(255, 255, 255, 0.6)" font-size="13" font-family="system-ui">Subtotal</text>
  <text x="590" y="270" fill="white" font-size="13" text-anchor="end" font-family="system-ui">$280.00</text>

  <text x="210" y="300" fill="rgba(255, 255, 255, 0.6)" font-size="13" font-family="system-ui">Express Shipping</text>
  <text x="590" y="300" fill="#4ade80" font-size="13" text-anchor="end" font-family="system-ui">FREE</text>

  <text x="210" y="340" fill="white" font-size="18" font-weight="900" font-family="system-ui">Total</text>
  <text x="590" y="340" fill="white" font-size="18" font-weight="900" text-anchor="end" font-family="system-ui">$280.00</text>

  <rect x="210" y="375" width="380" height="46" rx="12" fill="#6366f1"/>
  <text x="400" y="404" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui">Proceed to Express Checkout</text>
