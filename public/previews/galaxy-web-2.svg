<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgLight)"/>

  <!-- Category Filter Bar Header -->
  <text x="600" y="55" fill="#F59E0B" font-size="11" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="2" text-anchor="middle">ATELIER CATALOG</text>
  <text x="600" y="90" fill="#FFFFFF" font-size="32" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">Curated Collections by Department</text>

  <!-- Category Pills -->
  <g transform="translate(140, 120)">
    <!-- Pill 1: Active All -->
    <rect x="0" y="0" width="140" height="38" rx="19" fill="#F59E0B"/>
    <text x="70" y="24" fill="#020617" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">All Collections (11)</text>

    <!-- Pill 2: Furniture -->
    <rect x="155" y="0" width="160" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="235" y="24" fill="#E2E8F0" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Furniture &amp; Seating</text>

    <!-- Pill 3: Lighting -->
    <rect x="330" y="0" width="165" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="412" y="24" fill="#E2E8F0" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Architectural Lighting</text>

    <!-- Pill 4: Audio Tech -->
    <rect x="510" y="0" width="145" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="582" y="24" fill="#E2E8F0" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Audio &amp; Living Tech</text>

    <!-- Pill 5: Ceramics -->
    <rect x="670" y="0" width="135" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="737" y="24" fill="#E2E8F0" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Tableware &amp; Clay</text>

    <!-- Pill 6: Textiles -->
    <rect x="820" y="0" width="130" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="885" y="24" fill="#E2E8F0" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Living Textiles</text>
  </g>

  <!-- 3 Product Cards Grid Mockup -->
  <!-- Card 1: Koto Lounge Chair -->
  <g transform="translate(60, 190)">
    <rect width="330" height="500" rx="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="15" y="15" width="300" height="260" rx="20" fill="#0B132B" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="25" y="32" width="80" height="20" rx="10" fill="#F59E0B"/>
    <text x="65" y="46" fill="#020617" font-size="9" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">BESTSELLER</text>

    <text x="25" y="315" fill="#F59E0B" font-size="11" font-family="system-ui, sans-serif" font-weight="700">FURNITURE • BOUCLÉ</text>
    <text x="25" y="340" fill="#FFFFFF" font-size="17" font-family="system-ui, sans-serif" font-weight="800">Koto Sculptural Lounge Chair</text>
    <text x="25" y="365" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif">Solid kiln-dried FSC ash with tactile wool bouclé.</text>
    
    <!-- Material swatches -->
    <circle cx="35" cy="400" r="8" fill="#F4EBD9" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="60" cy="400" r="8" fill="#292524"/>
    <circle cx="85" cy="400" r="8" fill="#D6C7B2"/>

    <text x="25" y="455" fill="#FFFFFF" font-size="24" font-family="system-ui, sans-serif" font-weight="900">$1,850</text>
    <text x="110" y="455" fill="#64748B" font-size="14" font-family="system-ui, sans-serif" text-decoration="line-through">$2,100</text>
    
    <rect x="185" y="430" width="130" height="42" rx="21" fill="#F59E0B"/>
    <text x="250" y="456" fill="#020617" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">+ Add to Cart</text>
  </g>

  <!-- Card 2: Komorebi Chandelier -->
  <g transform="translate(435, 190)">
    <rect width="330" height="500" rx="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="15" y="15" width="300" height="260" rx="20" fill="#0B132B" stroke="#D4AF37" stroke-width="1.5"/>

    <rect x="25" y="32" width="75" height="20" rx="10" fill="#38BDF8"/>
    <text x="62" y="46" fill="#020617" font-size="9" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">ATELIER</text>

    <text x="25" y="315" fill="#38BDF8" font-size="11" font-family="system-ui, sans-serif" font-weight="700">LIGHTING • MOUTH-BLOWN</text>
    <text x="25" y="340" fill="#FFFFFF" font-size="17" font-family="system-ui, sans-serif" font-weight="800">Komorebi Fluted Brass Chandelier</text>
    <text x="25" y="365" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif">Hand-brushed raw brass with fluted opal glass.</text>
    
    <circle cx="35" cy="400" r="8" fill="#D4AF37" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="60" cy="400" r="8" fill="#18181B"/>
    <circle cx="85" cy="400" r="8" fill="#71717A"/>

    <text x="25" y="455" fill="#FFFFFF" font-size="24" font-family="system-ui, sans-serif" font-weight="900">$1,420</text>
    <text x="110" y="455" fill="#64748B" font-size="14" font-family="system-ui, sans-serif" text-decoration="line-through">$1,680</text>
    
    <rect x="185" y="430" width="130" height="42" rx="21" fill="#F59E0B"/>
    <text x="250" y="456" fill="#020617" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">+ Add to Cart</text>
  </g>

  <!-- Card 3: Aether 360 Speaker -->
  <g transform="translate(810, 190)">
    <rect width="330" height="500" rx="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="15" y="15" width="300" height="260" rx="20" fill="#0B132B" stroke="#10B981" stroke-width="1.5"/>

    <rect x="25" y="32" width="90" height="20" rx="10" fill="#10B981"/>
    <text x="70" y="46" fill="#FFFFFF" font-size="9" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">HI-FI SOUND</text>

    <text x="25" y="315" fill="#10B981" font-size="11" font-family="system-ui, sans-serif" font-weight="700">AUDIO TECH • KVRADRAT</text>
    <text x="25" y="340" fill="#FFFFFF" font-size="17" font-family="system-ui, sans-serif" font-weight="800">Aether 360° Audiophile Hi-Fi</text>
    <text x="25" y="365" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif">Bespoke Kvadrat wool wrap &amp; AirPlay 2 streaming.</text>
    
    <circle cx="35" cy="400" r="8" fill="#18181B" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="60" cy="400" r="8" fill="#E2E8F0"/>
    <circle cx="85" cy="400" r="8" fill="#78350F"/>

    <text x="25" y="455" fill="#FFFFFF" font-size="24" font-family="system-ui, sans-serif" font-weight="900">$890</text>
    <text x="95" y="455" fill="#64748B" font-size="14" font-family="system-ui, sans-serif" text-decoration="line-through">$1,050</text>
    
    <rect x="185" y="430" width="130" height="42" rx="21" fill="#F59E0B"/>
    <text x="250" y="456" fill="#020617" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">+ Add to Cart</text>
  </g>
</svg>
