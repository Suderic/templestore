  <circle cx="152" cy="335" r="30" fill="#6366f1" opacity="0.4"/>
  <text x="55" y="410" fill="white" font-size="13" font-weight="bold" font-family="system-ui">Stealth Modular Parka</text>
  <text x="55" y="430" fill="#a5b4fc" font-size="13" font-weight="bold" font-family="system-ui">$280</text>

