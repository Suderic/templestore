  <circle cx="505" cy="205" r="14" fill="#334155"/>
  <circle cx="545" cy="205" r="14" fill="#64748b"/>

  <text x="450" y="250" fill="rgba(255, 255, 255, 0.8)" font-size="12" font-weight="bold" font-family="system-ui">Select Size</text>
