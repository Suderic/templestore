    attachHistoryArchiveListeners() {
      document.getElementById('btn-history-back-today')?.addEventListener('click', () => {
        this.feedbackEngine.vibrate([15]);
        this.setTab('today');
      });

      document.querySelectorAll('[data-archive-date]').forEach(card => {
        card.addEventListener('click', () => {
          this.feedbackEngine.vibrate([15]);
          const dateStr = card.getAttribute('data-archive-date');
          this.showDayDetailModal(dateStr);
        });
      });
    }

    openNutritionModal() {
      const overlay = document.getElementById('nutrition-modal-overlay');
      const content = document.getElementById('nutrition-modal-content');
      if (!overlay || !content) return;

      this.renderNutritionModalContent(content);
      overlay.classList.add('open');
    }

    renderUnitOptions(food, selectedUnitKey) {
      if (food && food.units) {
        return Object.entries(food.units).map(([key, u]) => `
          <option value="${key}" ${selectedUnitKey === key ? 'selected' : ''}>${u.label}</option>
        `).join('');
      }
      return `
        <option value="piece" ${selectedUnitKey === 'piece' ? 'selected' : ''}>Piece(s) / Slice(s)</option>
        <option value="tbsp" ${selectedUnitKey === 'tbsp' ? 'selected' : ''}>Tablespoon / Spoon (tbsp)</option>
        <option value="tsp" ${selectedUnitKey === 'tsp' ? 'selected' : ''}>Teaspoon (tsp)</option>
        <option value="g" ${selectedUnitKey === 'g' ? 'selected' : ''}>Grams (g)</option>
        <option value="bowl" ${selectedUnitKey === 'bowl' ? 'selected' : ''}>Bowl(s)</option>
        <option value="plate" ${selectedUnitKey === 'plate' ? 'selected' : ''}>Plate(s)</option>
        <option value="cup" ${selectedUnitKey === 'cup' ? 'selected' : ''}>Cup(s) / Mug(s)</option>
        <option value="glass" ${selectedUnitKey === 'glass' ? 'selected' : ''}>Glass(es)</option>
        <option value="serving" ${selectedUnitKey === 'serving' ? 'selected' : ''}>Serving(s)</option>
      `;
    }

    calculateFoodNutrients(food, unitKey, quantity) {
      const qty = parseFloat(quantity) || 0;
      if (qty <= 0) return { calories: 0, protein: 0, carbs: 0, fat: 0, unitLabel: '' };

      if (food && food.units) {
        const unitDef = food.units[unitKey] || food.units[food.defaultUnit] || Object.values(food.units)[0];
        if (unitDef) {
          if (unitDef.per100g) {
            const factor = qty / 100;
            return {
              calories: Math.round(unitDef.calories * factor),
              protein: Math.round((unitDef.protein * factor) * 10) / 10,
              carbs: Math.round((unitDef.carbs * factor) * 10) / 10,
              fat: Math.round((unitDef.fat * factor) * 10) / 10,
              unitLabel: unitDef.label
            };
          } else {
            return {
              calories: Math.round(unitDef.calories * qty),
              protein: Math.round((unitDef.protein * qty) * 10) / 10,
              carbs: Math.round((unitDef.carbs * qty) * 10) / 10,
              fat: Math.round((unitDef.fat * qty) * 10) / 10,
              unitLabel: unitDef.label
            };
          }
        }
      }

      return { calories: 0, protein: 0, carbs: 0, fat: 0, unitLabel: unitKey };
    }

    renderNutritionModalContent(content) {
      if (!this.nutritionState) {
        this.nutritionState = {
          view: 'logger', // 'logger' | 'encyclopedia'
          activeDirectMeal: 'breakfast',
          directFoodName: '',
          directQty: 1,
          directUnit: 'piece',
          selectedDirectFood: null,
          encyclopediaCategory: 'all',
          encyclopediaSearch: '',
          encyclopediaTargetMeal: 'breakfast',

      // VIEW 1: DEDICATED FOOD & CALORIE ENCYCLOPEDIA

            food.category === cat ||

            (cat === 'breakfast' && (food.subCategory === 'breakfast' || food.category === 'breakfast'));

          return matchesQuery && matchesCat;
        });

        const categoriesList = [
          { key: 'all', label: 'All Foods' },
          { key: 'breakfast', label: '🇳🇵 Breakfast Staples' },
          { key: 'drinks', label: '☕ Teas & Drinks' },
          { key: 'carbs', label: '🍚 Rice, Roti & Carbs' },
          { key: 'proteins', label: '🍗 Meats, Eggs & Protein' },
          { key: 'dairy', label: '🥛 Dairy & Curd' },
          { key: 'fruits', label: '🍎 Fruits' },
          { key: 'snack', label: '🥟 Snacks & Mo:Mo' }
        ];

        content.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
            <div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <button type="button" id="btn-back-to-logger" style="background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 4px 8px; font-size: 0.76rem; font-weight: 600; cursor: pointer; color: var(--text-primary);">← Back</button>
                <div style="font-size: 1.05rem; font-weight: 700; color: var(--text-primary);">📖 Food & Calorie Guide</div>

          </div>

          <!-- Search Input -->
          <div style="margin-bottom: 10px;">

          </div>

          <!-- Category Filter Bar -->

            <span style="font-size: 0.74rem; font-weight: 600; color: var(--text-secondary);">Add selected item to:</span>
            <select id="encyclopedia-target-meal" class="setting-input" style="font-size: 0.76rem; padding: 3px 8px;">
              <option value="breakfast" ${this.nutritionState.encyclopediaTargetMeal === 'breakfast' ? 'selected' : ''}>🌅 Breakfast</option>
              <option value="lunch" ${this.nutritionState.encyclopediaTargetMeal === 'lunch' ? 'selected' : ''}>☀️ Lunch</option>
              <option value="dinner" ${this.nutritionState.encyclopediaTargetMeal === 'dinner' ? 'selected' : ''}>🌙 Dinner</option>
              <option value="snack" ${this.nutritionState.encyclopediaTargetMeal === 'snack' ? 'selected' : ''}>🍎 Snacks</option>
            </select>
          </div>

          <!-- Food Directory List -->
          <div class="food-directory-grid">
            ${filteredDirectory.length === 0 ? `
              <div style="font-size: 0.76rem; color: var(--text-muted); text-align: center; padding: 24px;">
                No matching foods found. Try typing a different keyword!
              </div>
            ` : filteredDirectory.map(food => {
              const multiplier = this.nutritionState.selectedServingMultipliers[food.id] || 1;
              const scaledCals = Math.round(food.calories * multiplier);
              const scaledProt = Math.round((food.protein * multiplier) * 10) / 10;
              const scaledCarbs = Math.round((food.carbs * multiplier) * 10) / 10;
              const scaledFat = Math.round((food.fat * multiplier) * 10) / 10;

              return `
                <div class="food-dir-card">
                  <div class="food-dir-main">
                    <div class="food-dir-header">
                      <span>${food.icon}</span>
                      <span>${food.name}</span>
                      <span style="font-size: 0.65rem; padding: 1px 5px; background: var(--bg-elevated); border-radius: 3px; color: var(--text-muted); font-weight: 500;">${food.origin || ''}</span>
                    </div>
                    <div class="food-dir-ingredients">
                      ${food.ingredients ? `<b>Ingredients:</b> ${food.ingredients} (${food.defaultServing})` : `Serving: ${food.defaultServing}`}

                    <div class="food-dir-macros">
                      <b style="color: #f59e0b;">${scaledCals} kcal</b> • 
                      <span style="color: #3b82f6; font-weight: 600;">${scaledProt}g P</span> • 
                      <span style="color: #10b981;">${scaledCarbs}g C</span> • 
                      <span style="color: #ec4899;">${scaledFat}g F</span>
                    </div>
                  </div>

                  <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
                    <div class="serving-selector-group">
                      ${[0.5, 1, 1.5, 2, 3].map(qty => `
                        <button type="button" class="serving-btn ${multiplier === qty ? 'active' : ''}" data-set-multiplier="${qty}" data-food-id="${food.id}">
                          ${qty}x
                        </button>
                      `).join('')}
                    </div>
                    <button type="button" class="btn-dir-add" data-add-directory-food-id="${food.id}">
                      + Add (${scaledCals} kcal)
                    </button>
                  </div>
                </div>

          </div>

          <div style="margin-top: 14px;">
            <button type="button" class="btn-timer btn-timer-primary" id="btn-done-encyclopedia" style="width: 100%; justify-content: center; padding: 9px; font-size: 0.84rem;">
              ← Back to Daily Meal Logger
            </button>
          </div>
        `;

        this.attachNutritionModalListeners(content);
        return;
      }

      // VIEW 2: CLEAN, STREAMLINED DAILY MEAL LOGGER
      const proteinPercent = Math.min(100, Math.round((totals.protein / (targets.targetProtein || 1)) * 100));
      const calPercent = Math.min(100, Math.round((totals.calories / (targets.targetCalories || 1)) * 100));
      const carbsPercent = Math.min(100, Math.round((totals.carbs / (targets.targetCarbs || 1)) * 100));
      const fatPercent = Math.min(100, Math.round((totals.fat / (targets.targetFat || 1)) * 100));

      const isTargetMet = totals.protein >= (targets.targetProtein * 0.9) && totals.calories >= (targets.targetCalories * 0.85);

      const mealSessions = [
        { key: 'breakfast', title: '🌅 Breakfast' },
        { key: 'lunch', title: '☀️ Lunch' },
        { key: 'dinner', title: '🌙 Dinner' },
        { key: 'snack', title: '🍎 Snacks & Beverages' }
      ];

      // Calculate initial preview for current direct input
      const initialCalc = this.calculateFoodNutrients(
        this.nutritionState.selectedDirectFood,
        this.nutritionState.directUnit,
        this.nutritionState.directQty
      );

      content.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
          <div>
            <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em;">🍽️ Nutrition & Daily Intake</div>
            <div style="font-size: 0.74rem; color: var(--text-secondary); margin-top: 2px;">
              Target: ${targets.targetCalories} kcal • ${targets.targetProtein}g Protein (${profile.fitnessGoal === 'muscle_gain' ? 'Muscle Gain' : profile.fitnessGoal === 'fat_loss' ? 'Fat Loss' : 'Maintenance'})
            </div>
          </div>
          <button type="button" class="btn-close-nutrition-modal-trigger" id="btn-close-nutrition-modal" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); padding: 4px 8px; border-radius: 4px;" title="Close">✕</button>
        </div>

        <!-- Link Button to Dedicated Calorie Guide / Encyclopedia -->
        <button type="button" class="btn-encyclopedia-link" id="btn-open-encyclopedia">
          <span>📖</span>
          <span>Open Food & Calorie Guide (Search Local Foods)</span>
          <span style="font-size: 0.74rem; opacity: 0.7;">→</span>
        </button>

        <!-- Progress Overview -->
        <div style="background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 12px; margin-bottom: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Macro Summary</span>
            <span class="status-chip ${isTargetMet ? 'active' : 'draft'}" style="font-size: 0.72rem;">
              ${isTargetMet ? 'Goal Reached ✨ (+10 pts)' : `${Math.max(0, targets.targetProtein - totals.protein)}g Protein Remaining`}
            </span>
          </div>

          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
            <!-- Protein -->
            <div style="background: var(--bg-card); padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
              <div style="display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 600;">
                <span style="color: #3b82f6;">PROTEIN</span>
                <span>${totals.protein} / ${targets.targetProtein}g</span>
              </div>
              <div class="macro-bar-track">
                <div class="macro-bar-fill protein" style="width: ${proteinPercent}%;"></div>
              </div>
            </div>

            <!-- Calories -->
            <div style="background: var(--bg-card); padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
              <div style="display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 600;">
                <span style="color: #f59e0b;">CALORIES</span>
                <span>${totals.calories} / ${targets.targetCalories} kcal</span>
              </div>
              <div class="macro-bar-track">
                <div class="macro-bar-fill calories" style="width: ${calPercent}%;"></div>
              </div>
            </div>

            <!-- Carbs -->
            <div style="background: var(--bg-card); padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
              <div style="display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 600;">
                <span style="color: #10b981;">CARBS</span>
                <span>${totals.carbs} / ${targets.targetCarbs}g</span>
              </div>
              <div class="macro-bar-track">
                <div class="macro-bar-fill carbs" style="width: ${carbsPercent}%;"></div>
              </div>
            </div>

            <!-- Fat -->
            <div style="background: var(--bg-card); padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
              <div style="display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 600;">
                <span style="color: #ec4899;">FATS</span>
                <span>${totals.fat} / ${targets.targetFat}g</span>
              </div>
              <div class="macro-bar-track">
                <div class="macro-bar-fill fat" style="width: ${fatPercent}%;"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- SMART FAST DIRECT FOOD ENTRY BOX WITH AUTOCOMPLETE & MEASUREMENT UNITS -->
        <div class="direct-entry-box">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="font-size: 0.82rem; font-weight: 700; color: var(--text-primary);">
              ✏️ Search Food & Auto-Calculate Calories
            </div>
            <div style="font-size: 0.68rem; color: var(--text-secondary);">
              Type to select • Auto unit conversion
            </div>
          </div>

          <!-- Top Row: Meal Time & Food Name with Autocomplete Dropdown -->
          <div style="display: grid; grid-template-columns: 1fr 1.8fr; gap: 8px; margin-bottom: 8px;">
            <div>
              <label style="font-size: 0.64rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Meal Time</label>
              <select id="direct-meal-category" class="setting-input" style="width: 100%; font-size: 0.78rem; margin-top: 2px;">
                <option value="breakfast" ${this.nutritionState.activeDirectMeal === 'breakfast' ? 'selected' : ''}>🌅 Breakfast</option>
                <option value="lunch" ${this.nutritionState.activeDirectMeal === 'lunch' ? 'selected' : ''}>☀️ Lunch</option>
                <option value="dinner" ${this.nutritionState.activeDirectMeal === 'dinner' ? 'selected' : ''}>🌙 Dinner</option>
                <option value="snack" ${this.nutritionState.activeDirectMeal === 'snack' ? 'selected' : ''}>🍎 Snack / Drink</option>
              </select>
            </div>

            <div class="autocomplete-container">
              <label style="font-size: 0.64rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Food / Beverage Name</label>
              <input type="text" id="direct-meal-name" class="setting-input" placeholder="🔍 Type e.g. Bread, Peanut Butter, Chia, Eggs, Rice..." value="${this.nutritionState.directFoodName || ''}" autocomplete="off" style="width: 100%; font-size: 0.78rem; margin-top: 2px;">
              <div id="food-autocomplete-dropdown" class="autocomplete-dropdown" style="display: none;"></div>
            </div>
          </div>

          <!-- Second Row: Quantity & Automatic Measurement Unit Display -->
          <div style="display: grid; grid-template-columns: 1fr 1.8fr; gap: 8px; margin-bottom: 8px;">
            <div>
              <label id="direct-meal-qty-label" style="font-size: 0.64rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">
                ${this.nutritionState.selectedDirectFood && this.nutritionState.selectedDirectFood.units && this.nutritionState.selectedDirectFood.units[this.nutritionState.directUnit] ? `Amount (${this.nutritionState.selectedDirectFood.units[this.nutritionState.directUnit].label.split('(')[0].trim()})` : 'Quantity (Amount)'}
              </label>
              <input type="number" id="direct-meal-qty" class="setting-input" placeholder="1" min="0.1" step="any" value="${this.nutritionState.directQty || 1}" style="width: 100%; font-size: 0.78rem; margin-top: 2px;">
            </div>
            <div>
              <label style="font-size: 0.64rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Unit of Measurement (Auto-Selected)</label>
              <select id="direct-meal-unit" class="setting-input" style="width: 100%; font-size: 0.78rem; margin-top: 2px;">
                ${this.renderUnitOptions(this.nutritionState.selectedDirectFood, this.nutritionState.directUnit)}
              </select>
            </div>
          </div>

          <!-- Live Calculation Preview Card -->
          <div id="direct-live-calc-preview" class="live-calc-preview-bar">
            <div style="font-weight: 600; color: var(--text-primary);">
              🔥 <span id="preview-cals" style="color: #f59e0b; font-weight: 700;">${initialCalc.calories > 0 ? `${initialCalc.calories} kcal` : 'Auto-Calculated'}</span>
            </div>
            <div style="font-size: 0.72rem;">
              <span id="preview-prot" style="color: #3b82f6; font-weight: 600;">${initialCalc.protein}g Protein</span> • 
              <span id="preview-carbs" style="color: #10b981;">${initialCalc.carbs}g Carbs</span> • 
              <span id="preview-fat" style="color: #ec4899;">${initialCalc.fat}g Fat</span>
            </div>
          </div>

          <div id="direct-meal-feedback" style="display: none; font-size: 0.74rem; color: #e11d48; font-weight: 600; margin-bottom: 6px;"></div>

          <button type="button" class="btn-timer btn-timer-primary" id="btn-add-direct-meal" style="width: 100%; justify-content: center; padding: 7px; font-size: 0.8rem; margin-top: 2px;">
            + Add to Meal Log
          </button>
        </div>

        <!-- 4 MEAL SESSIONS WITH 4 ESSENTIAL PRESETS EACH -->
        <div style="margin-bottom: 14px;">
          ${mealSessions.map(session => {
            const sessionMeals = allMeals.filter(m => (m.category || 'breakfast') === session.key);
            let sCals = 0, sProt = 0;
            sessionMeals.forEach(m => {
              sCals += (Number(m.calories) || 0);
              sProt += (Number(m.protein) || 0);
            });

            const presets = ESSENTIAL_MEAL_PRESETS[session.key] || [];

            return `
              <div class="meal-session-card">
                <div class="meal-session-header">
                  <div class="meal-session-title">
                    <span>${session.title}</span>
                    <span style="font-size: 0.72rem; font-weight: 500; color: var(--text-muted);">(${sessionMeals.length} logged)</span>
                  </div>
                  <div class="meal-session-subtotal">
                    <b style="color: #f59e0b;">${Math.round(sCals)} kcal</b> • 
                    <span style="color: #3b82f6;">${Math.round(sProt)}g P</span>
                  </div>
                </div>

                <div class="meal-items-list">
                  <!-- 4 Essential 1-Tap Quick Items -->
                  <div style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-top: 2px;">
                    ⚡ Quick 1-Tap Staples:
                  </div>
                  <div class="essential-quick-grid">
                    ${presets.map(item => `
                      <button type="button" class="essential-quick-btn" data-add-essential-id="${item.id}" data-essential-meal="${session.key}" title="${item.ingredients || ''}">
                        <div class="essential-btn-top">
                          <div class="essential-btn-label">
                            <span class="essential-icon">${item.icon}</span>
                            <span class="essential-title">${item.name}</span>
                          </div>
                          <span class="essential-btn-cals">${item.calories} kcal</span>
                        </div>
                        ${item.ingredients ? `
                          <div class="essential-btn-ingredients">
                            🌿 ${item.ingredients}
                          </div>
                        ` : ''}
                        <div class="essential-btn-macros">
                          <span style="color: #3b82f6; font-weight: 600;">${item.protein}g Protein</span>
                          <span style="color: var(--text-muted); font-size: 0.65rem;">•</span>
                          <span style="color: var(--text-secondary); font-size: 0.68rem;">${item.portion}</span>
                        </div>
                      </button>
                    `).join('')}
                  </div>

                  <!-- Logged Items List -->
                  ${sessionMeals.length > 0 ? `
                    <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px;">
                      ${sessionMeals.map(item => `
                        <div class="meal-item-row">
                          <div class="meal-item-info">
                            <div class="meal-item-name">
                              <span>${item.name}</span>
                              ${item.portion ? `<span style="font-size: 0.72rem; font-weight: 400; color: var(--text-secondary);">(${item.portion})</span>` : ''}
                            </div>
                            <div class="meal-item-macros">
                              <span style="color: #3b82f6;">${item.protein || 0}g P</span> • 
                              <span style="color: #10b981;">${item.carbs || 0}g C</span> • 
                              <span style="color: #ec4899;">${item.fat || 0}g F</span> • 
                              <b style="color: #f59e0b;">${item.calories || 0} kcal</b>
                            </div>
                          </div>
                          <button type="button" class="meal-log-delete" data-delete-meal-id="${item.id}" title="Remove Item">🗑️</button>
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- Bottom Done & Close Button -->
        <div style="margin-top: 14px;">
          <button type="button" class="btn-timer btn-timer-primary btn-close-nutrition-modal-trigger" id="btn-done-nutrition-modal" style="width: 100%; justify-content: center; padding: 9px; font-size: 0.84rem;">
            ✓ Done & Close
          </button>
        </div>
      `;

      this.attachNutritionModalListeners(content);
    }

    attachNutritionModalListeners(content) {
      const overlay = document.getElementById('nutrition-modal-overlay');

      // 1. Close buttons
      content.querySelectorAll('.btn-close-nutrition-modal-trigger').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          overlay?.classList.remove('open');
        });
      });

      overlay?.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('open');
      });

      // 2. Open Encyclopedia View
      const openEncycBtn = content.querySelector('#btn-open-encyclopedia');
      if (openEncycBtn) {
        openEncycBtn.addEventListener('click', () => {
          this.nutritionState.view = 'encyclopedia';
          this.renderNutritionModalContent(content);
        });
      }

      // 3. Back to Logger View
      const backBtn = content.querySelector('#btn-back-to-logger');
      const backBottomBtn = content.querySelector('#btn-done-encyclopedia');
      const handleBack = () => {
        this.nutritionState.view = 'logger';
        this.renderNutritionModalContent(content);
      };
      backBtn?.addEventListener('click', handleBack);
      backBottomBtn?.addEventListener('click', handleBack);

      // 4. Encyclopedia Search
      const searchInput = content.querySelector('#encyclopedia-search');
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          this.nutritionState.encyclopediaSearch = searchInput.value;
          this.renderNutritionModalContent(content);
          const newSearch = content.querySelector('#encyclopedia-search');
          if (newSearch) {
            newSearch.focus();
            newSearch.setSelectionRange(newSearch.value.length, newSearch.value.length);
          }
        });
      }

      // 5. Encyclopedia Category Filters
      content.querySelectorAll('[data-encyclopedia-cat]').forEach(pill => {
        pill.addEventListener('click', () => {
          this.nutritionState.encyclopediaCategory = pill.getAttribute('data-encyclopedia-cat');
          this.feedbackEngine.vibrate([10]);
          this.renderNutritionModalContent(content);
        });
      });

      // 6. Encyclopedia Target Meal Change
      const targetMealSelect = content.querySelector('#encyclopedia-target-meal');
      if (targetMealSelect) {
        targetMealSelect.addEventListener('change', () => {
          this.nutritionState.encyclopediaTargetMeal = targetMealSelect.value;
        });
      }

      // 7. Multipliers in Encyclopedia
      content.querySelectorAll('[data-set-multiplier]').forEach(btn => {
        btn.addEventListener('click', () => {
          const foodId = btn.getAttribute('data-food-id');
          const multiplier = parseFloat(btn.getAttribute('data-set-multiplier')) || 1;
          this.nutritionState.selectedServingMultipliers[foodId] = multiplier;
          this.feedbackEngine.vibrate([10]);
          this.renderNutritionModalContent(content);
        });
      });

      // 8. Add food from Encyclopedia
      content.querySelectorAll('[data-add-directory-food-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const foodId = btn.getAttribute('data-add-directory-food-id');
          const food = FOOD_DIRECTORY.find(f => f.id === foodId);
          if (!food) return;

          const multiplier = this.nutritionState.selectedServingMultipliers[food.id] || 1;
          const targetMeal = this.nutritionState.encyclopediaTargetMeal || 'breakfast';

          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');

          const meal = {
            id: `meal_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
            name: food.name,
            portion: multiplier === 1 ? food.defaultServing : `${multiplier}x (${food.defaultServing})`,
            category: targetMeal,
            protein: Math.round((food.protein * multiplier) * 10) / 10,
            carbs: Math.round((food.carbs * multiplier) * 10) / 10,
            fat: Math.round((food.fat * multiplier) * 10) / 10,
            calories: Math.round(food.calories * multiplier),
            loggedAt: `${hh}:${mm}`
          };

          this.db.addMeal(this.currentDate, meal);
          this.feedbackEngine.playTaskComplete();
          this.syncNutritionToTask();
          this.renderNutritionModalContent(content);
        });
      });

      // 9. Essential 1-Tap Staple Buttons
      content.querySelectorAll('[data-add-essential-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const essentialId = btn.getAttribute('data-add-essential-id');
          const mealKey = btn.getAttribute('data-essential-meal') || 'breakfast';
          const presetList = ESSENTIAL_MEAL_PRESETS[mealKey] || [];
          const preset = presetList.find(p => p.id === essentialId);
          if (!preset) return;

          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');

          const meal = {
            id: `meal_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
            name: preset.name,
            portion: preset.portion,
            category: mealKey,
            protein: preset.protein,
            carbs: preset.carbs,
            fat: preset.fat,
            calories: preset.calories,
            loggedAt: `${hh}:${mm}`
          };

          this.db.addMeal(this.currentDate, meal);
          this.feedbackEngine.playTaskComplete();
          this.syncNutritionToTask();
          this.renderNutritionModalContent(content);
        });
      });

      // 10. Autocomplete Search-as-you-type & Live Calculation
      const nameInput = content.querySelector('#direct-meal-name');
      const qtyInput = content.querySelector('#direct-meal-qty');
      const unitSelect = content.querySelector('#direct-meal-unit');
      const dropdown = content.querySelector('#food-autocomplete-dropdown');
      const feedback = content.querySelector('#direct-meal-feedback');
      const previewCals = content.querySelector('#preview-cals');
      const previewProt = content.querySelector('#preview-prot');
      const previewCarbs = content.querySelector('#preview-carbs');
      const previewFat = content.querySelector('#preview-fat');

      const updateLivePreview = () => {
        const qty = parseFloat(qtyInput?.value) || 0;
        const unit = unitSelect?.value || 'piece';
        const food = this.nutritionState.selectedDirectFood;

        const calc = this.calculateFoodNutrients(food, unit, qty);
        if (previewCals) previewCals.textContent = calc.calories > 0 ? `${calc.calories} kcal` : (food ? '0 kcal' : 'Custom');
        if (previewProt) previewProt.textContent = `${calc.protein}g Protein`;
        if (previewCarbs) previewCarbs.textContent = `${calc.carbs}g Carbs`;
        if (previewFat) previewFat.textContent = `${calc.fat}g Fat`;
        if (feedback) feedback.style.display = 'none';
      };

      if (nameInput && dropdown) {
        nameInput.addEventListener('input', () => {
          const query = nameInput.value.toLowerCase().trim();
          this.nutritionState.directFoodName = nameInput.value;

          if (!query) {
            dropdown.style.display = 'none';
            this.nutritionState.selectedDirectFood = null;
            updateLivePreview();
            return;
          }

          const queryWords = query.split(/\s+/).filter(Boolean);
          const matches = FOOD_DIRECTORY.filter(f => {
            const searchCorpus = `${f.name} ${f.ingredients || ''} ${f.origin || ''} ${f.keywords || ''} ${f.category || ''} ${f.subCategory || ''}`.toLowerCase();
            return queryWords.every(word => searchCorpus.includes(word));
          });

          if (matches.length === 0) {
            dropdown.innerHTML = `
              <div style="padding: 10px; font-size: 0.74rem; color: var(--text-muted); text-align: center;">
                No exact match found. You can still enter custom quantities!
              </div>
            `;
            dropdown.style.display = 'block';
            this.nutritionState.selectedDirectFood = null;
            updateLivePreview();
            return;
          }

          dropdown.innerHTML = matches.slice(0, 8).map(f => {
            const unitLabels = Object.values(f.units || {}).map(u => u.label.split(' ')[0]).join(', ');
            return `
              <div class="autocomplete-item" data-autocomplete-id="${f.id}">
                <div class="autocomplete-item-top">
                  <div class="autocomplete-item-name">
                    <span class="autocomplete-icon">${f.icon}</span>
                    <span class="autocomplete-title">${f.name}</span>
                    ${f.origin ? `<span class="autocomplete-origin-pill">${f.origin}</span>` : ''}
                  </div>
                  <span class="autocomplete-cals-badge">${f.calories} kcal</span>
                </div>
                ${f.ingredients ? `
                  <div class="autocomplete-item-ingredients">
                    🌿 ${f.ingredients}
                  </div>
                ` : ''}
                <div class="autocomplete-item-macros">
                  <span style="color: #3b82f6; font-weight: 600;">${f.protein}g P</span> • 
                  <span style="color: #10b981;">${f.carbs}g C</span> • 
                  <span style="color: #ec4899;">${f.fat}g F</span> • 
                  <span style="color: var(--text-muted); font-size: 0.65rem;">(${f.defaultServing})</span>
                </div>
              </div>
            `;
          }).join('');

          dropdown.style.display = 'block';

          dropdown.querySelectorAll('[data-autocomplete-id]').forEach(item => {
            item.addEventListener('click', (e) => {
              e.stopPropagation();
              const foodId = item.getAttribute('data-autocomplete-id');
              const food = FOOD_DIRECTORY.find(f => f.id === foodId);
              if (!food) return;

              this.nutritionState.selectedDirectFood = food;
              this.nutritionState.directFoodName = food.name;
              this.nutritionState.directUnit = food.defaultUnit || Object.keys(food.units || {})[0] || 'piece';
              
              const unitDef = food.units && food.units[this.nutritionState.directUnit];
              const defaultQty = unitDef?.defaultQty || 1;
              this.nutritionState.directQty = defaultQty;

              nameInput.value = food.name;
              if (qtyInput) qtyInput.value = defaultQty;
              
              const qtyLabel = content.querySelector('#direct-meal-qty-label');
              if (qtyLabel) {
                const labelText = unitDef ? unitDef.label.split('(')[0].trim() : 'Amount';
                qtyLabel.textContent = `Amount (${labelText})`;
              }

              if (unitSelect) {
                unitSelect.innerHTML = this.renderUnitOptions(food, this.nutritionState.directUnit);
              }

              dropdown.style.display = 'none';
              this.feedbackEngine.vibrate([10]);
              updateLivePreview();
            });
          });
        });

        // Hide dropdown on blur/outside click
        document.addEventListener('click', (e) => {
          if (!dropdown.contains(e.target) && e.target !== nameInput) {
            dropdown.style.display = 'none';
          }
        });
      }

      qtyInput?.addEventListener('input', () => {
        this.nutritionState.directQty = parseFloat(qtyInput.value) || 0;
        updateLivePreview();
      });

      unitSelect?.addEventListener('change', () => {
        this.nutritionState.directUnit = unitSelect.value;
        const food = this.nutritionState.selectedDirectFood;
        const unitDef = food && food.units && food.units[unitSelect.value];
        if (unitDef && unitDef.defaultQty) {
          const suggestedQty = unitDef.defaultQty;
          if (qtyInput) {
            qtyInput.value = suggestedQty;
            this.nutritionState.directQty = suggestedQty;
          }
        }
        const qtyLabel = content.querySelector('#direct-meal-qty-label');
        if (qtyLabel) {
          const labelText = unitDef ? unitDef.label.split('(')[0].trim() : 'Amount';
          qtyLabel.textContent = `Amount (${labelText})`;
        }
        updateLivePreview();
      });

      const categorySelect = content.querySelector('#direct-meal-category');
      if (categorySelect) {
        categorySelect.addEventListener('change', () => {
          this.nutritionState.activeDirectMeal = categorySelect.value;
        });
      }

      // 11. Add Direct Meal button
      const addDirectBtn = content.querySelector('#btn-add-direct-meal');
      addDirectBtn?.addEventListener('click', () => {
        const name = nameInput?.value?.trim();
        const qty = parseFloat(qtyInput?.value) || 0;
        const unit = unitSelect?.value || 'piece';
        const targetMeal = categorySelect?.value || this.nutritionState.activeDirectMeal || 'breakfast';
        const food = this.nutritionState.selectedDirectFood;

        if (!name && !food) {
          if (feedback) {
            feedback.textContent = '⚠️ Please enter or select a food name!';
            feedback.style.display = 'block';
          }
          return;
        }

        if (qty <= 0) {
          if (feedback) {
            feedback.textContent = '⚠️ Please enter a quantity greater than 0!';
            feedback.style.display = 'block';
          }
          return;
        }

        let calculated = this.calculateFoodNutrients(food, unit, qty);
        let portionLabel = `${qty} ${food && food.units && food.units[unit] ? food.units[unit].label.split('(')[0].trim() : unit}`;

        // If food wasn't selected from database but typed directly
        if (!food || calculated.calories === 0) {
          const matchingDbFood = FOOD_DIRECTORY.find(f => f.name.toLowerCase().trim() === name.toLowerCase().trim());
          if (matchingDbFood) {
            calculated = this.calculateFoodNutrients(matchingDbFood, unit, qty);
            portionLabel = `${qty} ${matchingDbFood.units && matchingDbFood.units[unit] ? matchingDbFood.units[unit].label.split('(')[0].trim() : unit}`;
          }
        }

        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');

        const meal = {
          id: `meal_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
          name: food ? food.name : name,
          portion: portionLabel,
          category: targetMeal,
          protein: calculated.protein,
          carbs: calculated.carbs,
          fat: calculated.fat,
          calories: calculated.calories,
          loggedAt: `${hh}:${mm}`
        };

        this.db.addMeal(this.currentDate, meal);
        this.feedbackEngine.playTaskComplete();
        this.syncNutritionToTask();

        // Reset inputs
        this.nutritionState.selectedDirectFood = null;
        this.nutritionState.directFoodName = '';
        this.nutritionState.directQty = 1;
        this.renderNutritionModalContent(content);
      });

      // 12. Delete Meal Item
      content.querySelectorAll('[data-delete-meal-id]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const mealId = btn.getAttribute('data-delete-meal-id');
          this.db.deleteMeal(this.currentDate, mealId);
          this.feedbackEngine.vibrate([10]);
          this.syncNutritionToTask();
          this.renderNutritionModalContent(content);
        });
      });
    }

    syncNutritionToTask() {
      const profile = this.db.getProfile();
      const targets = this.db.calculateBiometrics(profile);
      const totals = this.db.getDailyNutritionTotals(this.currentDate);

      const isTargetMet = totals.protein >= (targets.targetProtein * 0.9) && totals.calories >= (targets.targetCalories * 0.85);

      if (!this.currentLog.taskStates['protein_calories']) {
        this.currentLog.taskStates['protein_calories'] = { completed: false, isRestDay: false, value: 0 };
      }

      this.currentLog.taskStates['protein_calories'].completed = isTargetMet;
      const proteinTask = this.db.getTasks().find(t => t.id === 'protein_calories');
      this.currentLog.taskStates['protein_calories'].points = isTargetMet ? (proteinTask ? Number(proteinTask.points) || 14 : 14) : 0;
      this.currentLog.taskStates['protein_calories'].value = totals.protein;

      // Update Today View mini bars if visible
      const proteinPercent = Math.min(100, Math.round((totals.protein / (targets.targetProtein || 1)) * 100));
      const calPercent = Math.min(100, Math.round((totals.calories / (targets.targetCalories || 1)) * 100));

      const pVal = document.getElementById('protein-mini-val');
      const pBar = document.getElementById('protein-mini-bar');
      const cVal = document.getElementById('calorie-mini-val');
      const cBar = document.getElementById('calorie-mini-bar');
      const btnLabel = document.getElementById('nutrition-modal-btn-label');

      if (pVal) pVal.innerHTML = `${totals.protein} / ${targets.targetProtein}g <span style="font-size: 0.72rem; color: var(--text-muted);">(${proteinPercent}%)</span>`;
      if (pBar) pBar.style.width = `${proteinPercent}%`;
      if (cVal) cVal.innerHTML = `${totals.calories} / ${targets.targetCalories} kcal <span style="font-size: 0.72rem; color: var(--text-muted);">(${calPercent}%)</span>`;
      if (cBar) cBar.style.width = `${calPercent}%`;
      if (btnLabel) btnLabel.textContent = `🍽️ Log Meals & Macro Calculator (${totals.mealCount} Logged)`;

      const card = document.getElementById('task-card-protein_calories');
      const btn = document.getElementById('check-btn-protein_calories');
      if (card) card.classList.toggle('completed', isTargetMet);
      if (btn) btn.classList.toggle('checked', isTargetMet);

      this.updateLiveScoresAndStatus();
    }

    attachSettingsListeners() {
      const settings = this.db.getSettings();

      const updateProfileCalculations = () => {
        const p = this.db.getProfile();
        const pName = document.getElementById('profile-name')?.value;
        const pAge = parseInt(document.getElementById('profile-age')?.value, 10);
        const pHeight = parseFloat(document.getElementById('profile-height')?.value);
        const pWeight = parseFloat(document.getElementById('profile-weight')?.value);
        const pGender = document.getElementById('profile-gender')?.value;
        const pGoal = document.getElementById('profile-goal')?.value;
        const pActivity = parseFloat(document.getElementById('profile-activity')?.value);

        if (pName !== undefined) p.name = pName;
        if (!isNaN(pAge)) p.age = pAge;
        if (!isNaN(pHeight)) p.heightCm = pHeight;
        if (!isNaN(pWeight)) p.weightKg = pWeight;
        if (pGender) p.gender = pGender;
        if (pGoal) p.fitnessGoal = pGoal;
        if (!isNaN(pActivity)) p.activityLevel = pActivity;

        this.db.saveProfile(p);
        const bio = this.db.calculateBiometrics(p);

        const bmiPill = document.getElementById('profile-bmi-pill');
        if (bmiPill) {
          bmiPill.style.background = bio.bmiBg;
          bmiPill.style.color = bio.bmiColor;
          bmiPill.textContent = `BMI: ${bio.bmi} • ${bio.bmiCategory}`;
        }

        const calsSummary = document.getElementById('target-summary-cals');
        const protSummary = document.getElementById('target-summary-protein');
        const carbSummary = document.getElementById('target-summary-carbs');
        const fatSummary = document.getElementById('target-summary-fat');

        if (calsSummary) calsSummary.innerHTML = `🔥 <b>${bio.targetCalories}</b> kcal`;
        if (protSummary) protSummary.innerHTML = `🥩 <b>${bio.targetProtein}g</b> Protein`;
        if (carbSummary) carbSummary.innerHTML = `🍚 <b>${bio.targetCarbs}g</b> Carbs`;
        if (fatSummary) fatSummary.innerHTML = `🥑 <b>${bio.targetFat}g</b> Fat`;
      };

      document.getElementById('profile-name')?.addEventListener('input', updateProfileCalculations);
      document.getElementById('profile-age')?.addEventListener('input', updateProfileCalculations);
      document.getElementById('profile-height')?.addEventListener('input', updateProfileCalculations);
      document.getElementById('profile-weight')?.addEventListener('input', updateProfileCalculations);
      document.getElementById('profile-gender')?.addEventListener('change', updateProfileCalculations);
      document.getElementById('profile-goal')?.addEventListener('change', updateProfileCalculations);
      document.getElementById('profile-activity')?.addEventListener('change', updateProfileCalculations);

      // Habit Customizer Buttons
      document.getElementById('btn-add-custom-task')?.addEventListener('click', () => {
        this.feedbackEngine.vibrate([15]);
        this.openTaskModal(null);
      });

      document.getElementById('btn-reset-default-tasks')?.addEventListener('click', () => {
        if (confirm('Reset all daily habits back to the original 7 core protocols (101 pts)?')) {
          this.feedbackEngine.vibrate([25]);
          this.db.resetDefaultTasks();
          this.render();
        }
      });

      document.querySelectorAll('.btn-edit-task').forEach(btn => {
        btn.addEventListener('click', () => {
          const taskId = btn.getAttribute('data-task-id');
          this.feedbackEngine.vibrate([15]);
          this.openTaskModal(taskId);
        });
      });

      document.querySelectorAll('.btn-delete-task').forEach(btn => {
        btn.addEventListener('click', () => {
          const taskId = btn.getAttribute('data-task-id');
          const task = this.db.getTasks().find(t => t.id === taskId);
          if (confirm(`Are you sure you want to delete "${task?.name || 'this habit'}"?`)) {
            this.feedbackEngine.vibrate([20]);
            this.db.deleteTask(taskId);
            this.render();
          }
        });
      });

      document.getElementById('setting-theme')?.addEventListener('change', (e) => {
        settings.theme = e.target.value;
        this.db.saveSettings(settings);
        document.documentElement.setAttribute('data-theme', settings.theme);
      });

      document.querySelectorAll('[data-day-index]').forEach(btn => {
        btn.addEventListener('click', () => {
          const dayIdx = parseInt(btn.getAttribute('data-day-index'), 10);
          let restDays = settings.gymRestDays || [];
          if (restDays.includes(dayIdx)) {
            restDays = restDays.filter(d => d !== dayIdx);
          } else {
            restDays.push(dayIdx);
          }
          settings.gymRestDays = restDays;
          this.db.saveSettings(settings);
          btn.classList.toggle('active');
        });
      });

      document.getElementById('setting-wake-time')?.addEventListener('change', (e) => {
        settings.targetWakeTime = e.target.value;
        this.db.saveSettings(settings);
      });

      document.getElementById('setting-bed-time')?.addEventListener('change', (e) => {
        settings.targetBedTime = e.target.value;
        this.db.saveSettings(settings);
      });

      document.getElementById('setting-win-threshold')?.addEventListener('change', (e) => {
        settings.winThreshold = parseInt(e.target.value, 10) || 80;
        this.db.saveSettings(settings);
      });

      document.getElementById('setting-rollover')?.addEventListener('change', (e) => {
        settings.rolloverHour = parseInt(e.target.value, 10);
        this.db.saveSettings(settings);
      });

      document.getElementById('setting-sound')?.addEventListener('change', (e) => {
        settings.soundEnabled = e.target.checked;
        this.db.saveSettings(settings);
      });

      document.getElementById('setting-haptics')?.addEventListener('change', (e) => {
        settings.hapticsEnabled = e.target.checked;
        this.db.saveSettings(settings);
      });

      document.getElementById('btn-export-backup')?.addEventListener('click', () => {
        const json = this.db.exportFullBackup();
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `win-the-day-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      const importInput = document.getElementById('import-file-input');
      document.getElementById('btn-import-backup')?.addEventListener('click', () => {
        importInput?.click();
      });

      importInput?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const res = this.db.importFullBackup(event.target.result);
            if (res.success) {
              this.currentLog = this.db.getDailyLog(this.currentDate);
              this.render();
            }
          };
          reader.readAsText(file);
        }
      });

      document.getElementById('btn-clear-history')?.addEventListener('click', () => {
        this.db.clearAllData();
        this.currentLog = this.db.getDailyLog(this.currentDate);
        this.setTab('today');
      });
    }

                <option value="evening" ${currentCategory === 'evening' ? 'selected' : ''}>🌙 Evening Protocol</option>
                <option value="custom" ${currentCategory === 'custom' ? 'selected' : ''}>🎯 Custom Goal</option>
              </select>
            </div>
            <div>
              <label class="modal-form-label">Points Auto-Weight</label>
              <div style="padding: 7px 10px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 0.76rem; font-weight: 700; color: #d97706;">
                ⚖️ Auto-Balanced (101 pts total)
              </div>
            </div>
          </div>

          <div class="modal-form-group">
            <label class="modal-form-label">Icon Emoji</label>
            <div style="display: flex; gap: 8px; align-items: center;">
              <input type="text" id="task-form-icon" class="setting-input" style="width: 54px; text-align: center; font-size: 1.1rem; padding: 4px;" value="${currentIcon}" maxlength="4">
              <div style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap;">
                ${['🎯', '📖', '🚿', '🧘', '🏃', '💧', '🥗', '⚡', '🌙', '🏋️', '🧹', '☀️', '🧠', '✍️', '🍎'].map(emoji => `
                  <button type="button" class="btn-emoji-pick" data-emoji="${emoji}" style="background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 3px 6px; font-size: 0.85rem; cursor: pointer;">${emoji}</button>
                `).join('')}
              </div>
            </div>
          </div>

          <div class="modal-form-group">
            <label class="modal-form-label">Standard of Completion / Description</label>
            <input type="text" id="task-form-desc" class="setting-input" style="width: 100%; font-size: 0.8rem;" placeholder="e.g. Read 20 pages before bed without phone" value="${currentDesc}">
          </div>

          <div style="display: flex; gap: 10px; margin-top: 18px;">
            <button type="submit" class="btn-primary" style="flex: 1; padding: 10px; font-size: 0.84rem;">
              💾 ${isNew ? 'Create Habit' : 'Save Changes'}
            </button>
            <button type="button" class="btn-timer btn-timer-secondary btn-close-task-modal-trigger" style="padding: 10px 14px; font-size: 0.84rem;">
              Cancel
            </button>
          </div>
        </form>
      `;

      overlay.classList.add('open');

      // Emoji picker buttons
      content.querySelectorAll('.btn-emoji-pick').forEach(b => {
        b.addEventListener('click', () => {
          const iconInput = document.getElementById('task-form-icon');
          if (iconInput) iconInput.value = b.getAttribute('data-emoji');
        });
      });

      // Form submission
      const form = document.getElementById('task-edit-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const nameVal = document.getElementById('task-form-name')?.value.trim();
          const catVal = document.getElementById('task-form-category')?.value;
          const descVal = document.getElementById('task-form-desc')?.value.trim();
          const iconVal = document.getElementById('task-form-icon')?.value.trim() || '🎯';

          if (!nameVal) {
            alert('Please provide a habit title.');
            return;
          }

          if (isNew) {
            this.db.addTask({
              name: nameVal,
              category: catVal,
              description: descVal,
              icon: iconVal,
              type: 'binary'
            });
          } else {
            this.db.updateTask(taskId, {
              name: nameVal,
              category: catVal,
              description: descVal,
              icon: iconVal,
              iconSvg: `<span style="font-size: 1.15rem;">${iconVal}</span>`
            });
          }

          this.feedbackEngine.vibrate([30]);
          overlay.classList.remove('open');
          this.render();
        });
      }

      // Close handlers
      content.querySelectorAll('.btn-close-task-modal-trigger').forEach(b => {
        b.addEventListener('click', () => {
          overlay.classList.remove('open');
        });
      });

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('open');
      });
    }

    renderProfileView() {
      const profile = this.db.getProfile();
      const biometrics = this.db.calculateBiometrics(profile);
      const stats = this.db.getLifetimeStats();
      const name = profile.name || 'Athlete';
      const initials = name.trim().split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) || 'A';

      const heightM = (Number(profile.heightCm) || 175) / 100;
      const minHealthyWeight = Math.round(18.5 * heightM * heightM);
      const maxHealthyWeight = Math.round(24.9 * heightM * heightM);

      const winRate = stats.totalDaysTracked > 0 ? Math.round((stats.totalDaysWon / stats.totalDaysTracked) * 100) : 0;
      const avgScore = stats.totalDaysTracked > 0 ? Math.round(stats.lifetimePoints / stats.totalDaysTracked) : 0;

      const goalLabels = {
        muscle_gain: "Muscle Gain (+300 kcal)",
        maintenance: "Maintenance (0 kcal)",
        fat_loss: "Fat Loss (-350 kcal)"
      };

      return `
        <div style="padding: 16px 20px;">
          <!-- Top Navigation Back Button & Edit Profile Button -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <button type="button" class="btn-timer btn-timer-secondary" id="btn-profile-back-today" style="padding: 6px 12px; font-size: 0.8rem;">
              ← Back to Today
            </button>
            <button type="button" class="btn-timer btn-timer-primary" id="btn-profile-edit-toggle" style="padding: 6px 12px; font-size: 0.8rem;">
              ✏️ Edit Profile Info
            </button>
          </div>

          <!-- Profile Hero Card -->
          <div class="profile-hero-card">
            <div class="profile-large-avatar">${initials}</div>
            <div style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em;">${name}</div>
            <div style="font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px;">
              ${profile.gender === 'female' ? 'Female' : 'Male'} • ${profile.age || 25} Years Old • ${goalLabels[profile.fitnessGoal] || 'Fitness Tracker'}
            </div>

            <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center;">
              <span class="status-chip active" style="font-size: 0.74rem;">🔥 ${stats.currentStreak} Day Streak</span>
              <span class="status-chip draft" style="font-size: 0.74rem;">🏆 ${stats.bestStreak} Best Streak</span>
              <span class="status-chip active" style="font-size: 0.74rem; background: #6366f1;">⭐ ${stats.lifetimePoints.toLocaleString()} Pts</span>
            </div>
          </div>

          <!-- Quick Edit Drawer -->
          <div id="profile-edit-drawer" style="display: none; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow-md);">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text-primary); margin-bottom: 10px;">✏️ Update Personal Info</div>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px;">
              <div>
                <label style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">NAME</label>
                <input type="text" id="pedit-name" class="setting-input" value="${profile.name || ''}" style="width: 100%; margin-top: 2px;">
              </div>
              <div>
                <label style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">AGE</label>
                <input type="number" id="pedit-age" class="setting-input" value="${profile.age || 25}" style="width: 100%; margin-top: 2px;">
              </div>
              <div>
                <label style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">HEIGHT (CM)</label>
                <input type="number" id="pedit-height" class="setting-input" value="${profile.heightCm || 175}" style="width: 100%; margin-top: 2px;">
              </div>
              <div>
                <label style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">WEIGHT (KG)</label>
                <input type="number" id="pedit-weight" class="setting-input" value="${profile.weightKg || 70}" step="0.5" style="width: 100%; margin-top: 2px;">
              </div>
              <div>
                <label style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">GENDER</label>
                <select id="pedit-gender" class="setting-input" style="width: 100%; margin-top: 2px;">
                  <option value="male" ${profile.gender === 'male' ? 'selected' : ''}>Male</option>
                  <option value="female" ${profile.gender === 'female' ? 'selected' : ''}>Female</option>
                </select>
              </div>
              <div>
                <label style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">GOAL</label>
                <select id="pedit-goal" class="setting-input" style="width: 100%; margin-top: 2px;">
                  <option value="muscle_gain" ${profile.fitnessGoal === 'muscle_gain' ? 'selected' : ''}>Muscle Gain (+300 kcal)</option>
                  <option value="maintenance" ${profile.fitnessGoal === 'maintenance' ? 'selected' : ''}>Maintenance (0 kcal)</option>
                  <option value="fat_loss" ${profile.fitnessGoal === 'fat_loss' ? 'selected' : ''}>Fat Loss (-350 kcal)</option>
                </select>
              </div>
            </div>
            <button type="button" class="btn-timer btn-timer-primary" id="btn-save-pedit" style="width: 100%; justify-content: center; padding: 8px; font-size: 0.82rem; margin-top: 0;">Save & Recalculate</button>
          </div>

          <!-- Body Composition & Biometrics Hub -->
          <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow-sm);">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
              <span>⚖️ Body Composition & BMI</span>
              <span class="bmi-pill-badge" style="background: ${biometrics.bmiBg}; color: ${biometrics.bmiColor};">
                ${biometrics.bmi} • ${biometrics.bmiCategory}
              </span>
            </div>

            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px;">
              <div class="profile-stat-box">
                <div style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">Weight</div>
                <div style="font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-top: 2px;">${profile.weightKg || 70} <span style="font-size: 0.72rem; font-weight: 500;">kg</span></div>
              </div>
              <div class="profile-stat-box">
                <div style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">Height</div>
                <div style="font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-top: 2px;">${profile.heightCm || 175} <span style="font-size: 0.72rem; font-weight: 500;">cm</span></div>
              </div>
              <div class="profile-stat-box">
                <div style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">Age</div>
                <div style="font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-top: 2px;">${profile.age || 25} <span style="font-size: 0.72rem; font-weight: 500;">yrs</span></div>
              </div>
            </div>

            <div style="background: var(--bg-elevated); border-radius: var(--radius-sm); padding: 10px; font-size: 0.76rem; color: var(--text-secondary); line-height: 1.45;">
              💡 Healthy weight range for your ${profile.heightCm}cm height: <span style="color: var(--text-primary); font-weight: 600;">${minHealthyWeight} - ${maxHealthyWeight} kg</span>.
            </div>
          </div>

          <!-- Energy Expenditure & Daily Targets (Necessity) -->
          <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow-sm);">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;">⚡ Energy & Macro Necessity</div>
            <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 12px;">
              Basal Metabolic Rate: <span style="color: var(--text-primary); font-weight: 600;">${biometrics.bmr} kcal</span> • Maintenance TDEE: <span style="color: var(--text-primary); font-weight: 600;">${biometrics.tdee} kcal</span>
            </div>

            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
              <div style="background: var(--bg-elevated); padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
                <div style="font-size: 0.68rem; font-weight: 600; color: #f59e0b; text-transform: uppercase; letter-spacing: 0.04em;">Daily Calorie Goal</div>
                <div style="font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-top: 2px;">${biometrics.targetCalories} <span style="font-size: 0.72rem; font-weight: 500;">kcal</span></div>
              </div>

              <div style="background: var(--bg-elevated); padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
                <div style="font-size: 0.68rem; font-weight: 600; color: #3b82f6; text-transform: uppercase; letter-spacing: 0.04em;">Target Protein</div>
                <div style="font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-top: 2px;">${biometrics.targetProtein} <span style="font-size: 0.72rem; font-weight: 500;">g</span></div>
              </div>

              <div style="background: var(--bg-elevated); padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
                <div style="font-size: 0.68rem; font-weight: 600; color: #10b981; text-transform: uppercase; letter-spacing: 0.04em;">Target Carbs</div>
                <div style="font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-top: 2px;">${biometrics.targetCarbs} <span style="font-size: 0.72rem; font-weight: 500;">g</span></div>
              </div>

              <div style="background: var(--bg-elevated); padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
                <div style="font-size: 0.68rem; font-weight: 600; color: #ec4899; text-transform: uppercase; letter-spacing: 0.04em;">Target Healthy Fats</div>
                <div style="font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-top: 2px;">${biometrics.targetFat} <span style="font-size: 0.72rem; font-weight: 500;">g</span></div>
              </div>
            </div>
          </div>

          <!-- Lifetime Discipline & App Stats -->
          <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 20px; box-shadow: var(--shadow-sm);">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text-primary); margin-bottom: 12px;">📊 Discipline & Productivity Milestones</div>

            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
              <div class="profile-stat-box">
                <div style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">Days Tracked</div>
                <div style="font-size: 1.15rem; font-weight: 700; color: var(--text-primary);">${stats.totalDaysTracked} days</div>
              </div>

              <div class="profile-stat-box">
                <div style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">Win Rate</div>
                <div style="font-size: 1.15rem; font-weight: 700; color: #16a34a;">${winRate}% (${stats.totalDaysWon} won)</div>
              </div>

              <div class="profile-stat-box">
                <div style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">Average Daily Score</div>
                <div style="font-size: 1.15rem; font-weight: 700; color: #6366f1;">${avgScore} / 101 pts</div>
              </div>

              <div class="profile-stat-box">
                <div style="font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em;">Longest Streak</div>
                <div style="font-size: 1.15rem; font-weight: 700; color: #0284c7;">🏆 ${stats.bestStreak} days</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    attachProfileListeners() {
      document.getElementById('btn-profile-back-today')?.addEventListener('click', () => {
        this.feedbackEngine.vibrate([15]);
        this.setTab('today');
      });

      const editBtn = document.getElementById('btn-profile-edit-toggle');
      const editDrawer = document.getElementById('profile-edit-drawer');
      editBtn?.addEventListener('click', () => {
        if (editDrawer) {
          const isHidden = editDrawer.style.display === 'none';
          editDrawer.style.display = isHidden ? 'block' : 'none';
          editBtn.textContent = isHidden ? '✕ Close Edit' : '✏️ Edit Profile Info';
        }
      });

      document.getElementById('btn-save-pedit')?.addEventListener('click', () => {
        const p = this.db.getProfile();
        const pName = document.getElementById('pedit-name')?.value;
        const pAge = parseInt(document.getElementById('pedit-age')?.value, 10);
        const pHeight = parseFloat(document.getElementById('pedit-height')?.value);
        const pWeight = parseFloat(document.getElementById('pedit-weight')?.value);
        const pGender = document.getElementById('pedit-gender')?.value;
        const pGoal = document.getElementById('pedit-goal')?.value;

        if (pName) p.name = pName;
        if (!isNaN(pAge)) p.age = pAge;
        if (!isNaN(pHeight)) p.heightCm = pHeight;
        if (!isNaN(pWeight)) p.weightKg = pWeight;
        if (pGender) p.gender = pGender;
        if (pGoal) p.fitnessGoal = pGoal;

        this.db.saveProfile(p);
        this.feedbackEngine.playTaskComplete();
        this.render();
      });
    }

    setTab(tabName) {
      this.currentTab = tabName;
      this.render();
    }

    updateNavState() {
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        const tab = btn.getAttribute('data-tab');
        if (tab === this.currentTab) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }
  }

  // ==========================================
  // 9. APP INITIALIZER
  // ==========================================
  function bootstrapApp() {
    const db = new Database();
    const scoringEngine = new ScoringEngine(db);
    const feedbackEngine = new FeedbackEngine(db);

    const settings = db.getSettings();
    const initialLog = db.getDailyLog(db.getEffectiveDate());

    const focusTimer = new FocusTimer({
      targetMinutes: settings.projectTimerMinutes || 60
    });
    if (initialLog.timerSeconds) {
      focusTimer.loadState(initialLog.timerSeconds);
    }

    const analyticsEngine = new AnalyticsEngine(db, scoringEngine);
    const uiManager = new UIManager(db, scoringEngine, focusTimer, analyticsEngine, feedbackEngine);

    document.documentElement.setAttribute('data-theme', settings.theme || 'light');
    uiManager.render();

    window.__app = { db, scoringEngine, uiManager };

    document.querySelectorAll('.nav-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetTab = btn.getAttribute('data-tab');
        if (targetTab) {
          feedbackEngine.vibrate([15]);
          uiManager.setTab(targetTab);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });

    let lastEffectiveDate = db.getEffectiveDate();
    setInterval(() => {
      const currentEffectiveDate = db.getEffectiveDate();
      if (currentEffectiveDate !== lastEffectiveDate) {
        lastEffectiveDate = currentEffectiveDate;
        db.recalculateLifetimeStats();
        uiManager.render();
      }
    }, 60000);

    if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrapApp);
  } else {
    bootstrapApp();
  }
})();

</script>
</body>
</html>
