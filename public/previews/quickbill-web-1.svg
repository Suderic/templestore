    <text x="120" y="374" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">POWERED BY QUICKBILL POS</text>

    <!-- Thermal Printer Badge -->
    <rect x="24" y="392" width="192" height="30" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="120" y="411" fill="#475569" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2" / 3" Thermal &amp; Bluetooth Ready</text>
