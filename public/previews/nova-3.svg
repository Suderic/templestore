  <text x="315" y="215" fill="#a855f7" font-size="32" font-weight="bold" font-family="system-ui">$79<tspan font-size="12" fill="rgba(255, 255, 255, 0.5)">/mo</tspan></text>
  <rect x="315" y="245" width="170" height="8" rx="4" fill="rgba(255, 255, 255, 0.5)"/>
  <rect x="315" y="265" width="150" height="8" rx="4" fill="rgba(255, 255, 255, 0.5)"/>
  <rect x="315" y="285" width="160" height="8" rx="4" fill="rgba(255, 255, 255, 0.5)"/>
  <rect x="315" y="350" width="170" height="38" rx="8" fill="#6366f1"/>
