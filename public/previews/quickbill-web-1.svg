      <text x="344" y="24" fill="#ffffff" font-size="11" font-weight="600" text-anchor="end" font-family="system-ui, sans-serif">$17.00</text>

      <text x="16" y="44" fill="#10b981" font-size="11" font-family="system-ui, sans-serif">Loyalty Discount (10%)</text>
      <text x="344" y="44" fill="#10b981" font-size="11" font-weight="600" text-anchor="end" font-family="system-ui, sans-serif">-$1.70</text>

      <text x="16" y="64" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">VAT / Sales Tax (13%)</text>
