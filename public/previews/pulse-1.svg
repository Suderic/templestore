<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#04130f"/>
  
  <!-- Left Phone Mockup -->
  <rect x="180" y="30" width="200" height="440" rx="32" fill="#0b1b16" stroke="rgba(16, 185, 129, 0.4)" stroke-width="3"/>
  <rect x="240" y="42" width="80" height="16" rx="8" fill="#04130f"/>
  <circle cx="280" cy="50" r="4" fill="#10b981" opacity="0.8"/>

  <!-- Phone 1 screen content -->
  <text x="205" y="90" fill="#a7f3d0" font-size="11" font-weight="600" font-family="system-ui">TODAY'S TARGET</text>
  <text x="205" y="112" fill="white" font-size="18" font-weight="bold" font-family="system-ui">Good morning, Alex</text>

  <!-- Circular progress ring -->
  <circle cx="280" cy="180" r="50" stroke="rgba(255, 255, 255, 0.1)" stroke-width="10" fill="none"/>
  <circle cx="280" cy="180" r="50" stroke="url(#ringGrad)" stroke-width="10" fill="none" stroke-dasharray="314" stroke-dashoffset="65" stroke-linecap="round"/>
  <text x="280" y="180" fill="white" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui">82%</text>
  <text x="280" y="196" fill="#6ee7b7" font-size="9" text-anchor="middle" font-family="system-ui">Daily Goal</text>

  <!-- Habits Cards -->
  <rect x="195" y="250" width="170" height="40" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)"/>
  <circle cx="215" cy="270" r="8" fill="#10b981"/>
  <text x="232" y="274" fill="white" font-size="10" font-weight="bold" font-family="system-ui">Hydration (2.4L / 3L)</text>

  <rect x="195" y="300" width="170" height="40" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)"/>
  <circle cx="215" cy="320" r="8" fill="#10b981"/>
  <text x="232" y="324" fill="white" font-size="10" font-weight="bold" font-family="system-ui">Morning HIIT (30m)</text>

  <rect x="195" y="350" width="170" height="40" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
  <circle cx="215" cy="370" r="8" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
  <text x="232" y="374" fill="rgba(255, 255, 255, 0.7)" font-size="10" font-family="system-ui">Mindfulness Meditation</text>

  <!-- Right Phone Mockup -->
  <rect x="420" y="30" width="200" height="440" rx="32" fill="#0b1b16" stroke="rgba(6, 182, 212, 0.4)" stroke-width="3"/>
  <rect x="480" y="42" width="80" height="16" rx="8" fill="#04130f"/>
  <circle cx="520" cy="50" r="4" fill="#06b6d4" opacity="0.8"/>

  <!-- Phone 2 screen content -->
  <text x="445" y="90" fill="#67e8f9" font-size="11" font-weight="600" font-family="system-ui">WORKOUT LOG</text>
  <text x="445" y="112" fill="white" font-size="18" font-weight="bold" font-family="system-ui">Upper Body Strength</text>

  <rect x="435" y="135" width="170" height="70" rx="12" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.3)"/>
  <text x="450" y="160" fill="white" font-size="12" font-weight="bold" font-family="system-ui">Bench Press</text>
  <text x="450" y="180" fill="#67e8f9" font-size="10" font-family="system-ui">4 sets × 10 reps (85 kg)</text>

  <rect x="435" y="215" width="170" height="70" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="450" y="240" fill="white" font-size="12" font-weight="bold" font-family="system-ui">Incline DB Row</text>
  <text x="450" y="260" fill="rgba(255, 255, 255, 0.6)" font-size="10" font-family="system-ui">3 sets × 12 reps (32 kg)</text>

  <rect x="435" y="380" width="170" height="42" rx="12" fill="#10b981"/>
  <text x="520" y="406" fill="white" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">Finish Workout ✓</text>
</svg>
