<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="receiptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#qbBg)"/>

  <!-- Ambient Glow -->
  <circle cx="260" cy="220" r="160" fill="#6366f1" opacity="0.08"/>
  <circle cx="600" cy="240" r="140" fill="#0ea5e9" opacity="0.06"/>

  <!-- Left Side: POS Counter & Bill Builder Dashboard -->
  <g transform="translate(60, 40)">
    <!-- Main Window / Tablet Frame -->
    <rect width="400" height="420" rx="20" fill="#1e293b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <rect x="2" y="2" width="396" height="416" rx="18" fill="#0f172a"/>

    <!-- Window Header -->
    <rect x="2" y="2" width="396" height="40" rx="18" fill="#1e293b"/>
    <circle cx="24" cy="22" r="5" fill="#ef4444"/>
    <circle cx="38" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="22" r="5" fill="#10b981"/>
    <text x="74" y="26" fill="#ffffff" font-size="12" font-weight="700" font-family="system-ui, sans-serif">QuickBill POS — Offline Store Register</text>
    <rect x="310" y="12" width="76" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="348" y="26" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">● Offline</text>

    <!-- Business Header in app -->
    <g transform="translate(20, 54)">
