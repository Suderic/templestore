  <rect width="800" height="500" fill="url(#apexBg)"/>
  
  <!-- Store Header -->
  <rect x="40" y="30" width="720" height="50" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
