<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Win the Day</title>
  
  <!-- PWA & Mobile App Meta -->
  <meta name="description" content="Offline-first personal productivity and habit scoring engine.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Win the Day">
  
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   WIN THE DAY - Modern Aesthetic Design System (Inspired by Bend & Gentler Streak)
   ========================================================================== */

:root {
  /* LIGHT MODE (Bend Daylight) - Soft Warm Canvas & Pillowy Cards */
  --bg-primary: #f8fafc;
  --bg-secondary: rgba(255, 255, 255, 0.88);
  --bg-card: #ffffff;
  --bg-card-hover: #fbfcfe;
  --bg-elevated: #f1f5f9;
  --bg-elevated-hover: #e2e8f0;
  
  --border-subtle: rgba(15, 23, 42, 0.07);
  --border-card: rgba(15, 23, 42, 0.05);
  --border-focus: #3b82f6;
  
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  
  /* Brand Vibrant Accents */
  --accent-emerald: #10b981;
  --accent-emerald-light: #ecfdf5;
  --accent-emerald-glow: rgba(16, 185, 129, 0.18);
  
  --accent-blue: #0284c7;
  --accent-blue-light: #f0f9ff;
  
  --accent-amber: #f59e0b;
  --accent-amber-light: #fffbeb;
  
  --accent-coral: #f97316;
  --accent-coral-light: #fff7ed;
  
  --accent-indigo: #6366f1;
  --accent-indigo-light: #eef2ff;
  
  --accent-rose: #f43f5e;
  --accent-rose-light: #fff1f2;

  /* Ambient Diffuse Shadows (Bend & Gentler Streak) */
  --shadow-sm: 0 2px 6px -1px rgba(15, 23, 42, 0.04), 0 1px 3px -1px rgba(15, 23, 42, 0.02);
  --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.05), 0 3px 8px -2px rgba(15, 23, 42, 0.02);
  --shadow-lg: 0 16px 36px -6px rgba(15, 23, 42, 0.07), 0 6px 14px -3px rgba(15, 23, 42, 0.03);
  --shadow-glow-warm: 0 8px 28px -4px rgba(249, 115, 22, 0.18);
  --shadow-glow-emerald: 0 8px 28px -4px rgba(16, 185, 129, 0.22);
  
  /* Organic Radii */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 30px;
  --radius-full: 9999px;
  
  --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 16px);
  --header-bg-gradient: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(241, 245, 253, 0.92) 50%, rgba(238, 242, 255, 0.94) 100%);
}

/* DARK MODE (Gentler Obsidian) - Velvety Depth & Radiant Micro-Glows */
[data-theme="dark"] {
  --bg-primary: #0b0f17;
  --bg-secondary: rgba(15, 21, 32, 0.88);
  --bg-card: #151b28;
  --bg-card-hover: #1c2436;
  --bg-elevated: #1e2638;
  --bg-elevated-hover: #263147;
  
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-card: rgba(255, 255, 255, 0.06);
  --border-focus: #60a5fa;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  
  --accent-emerald-light: rgba(16, 185, 129, 0.16);
  --accent-blue-light: rgba(2, 132, 199, 0.16);
  --accent-amber-light: rgba(245, 158, 11, 0.16);
  --accent-coral-light: rgba(249, 115, 22, 0.16);
  --accent-indigo-light: rgba(99, 102, 241, 0.16);
  --accent-rose-light: rgba(244, 63, 94, 0.16);

  --shadow-sm: 0 2px 6px -1px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 16px 36px -6px rgba(0, 0, 0, 0.6);
  --header-bg-gradient: linear-gradient(135deg, rgba(14, 20, 32, 0.97) 0%, rgba(24, 32, 50, 0.95) 50%, rgba(22, 26, 44, 0.97) 100%);
}

/* Base Resets & Typography */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

button, input, textarea, select {
  user-select: auto;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button {
  font-family: var(--font-sans);
  letter-spacing: -0.01em;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
  line-height: 1.55;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  transition: background-color 0.3s ease, color 0.3s ease;
}

#app-container {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--bg-primary);
  position: relative;
  padding-bottom: calc(84px + var(--safe-bottom));
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.03);
  transition: background-color 0.3s ease;
}

/* ==========================================================================
   TOP HEADER & MODERN TITLE BAR WITH THEME TOGGLE
   ========================================================================== */
.top-header {
  padding: 16px 20px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: radial-gradient(circle at 85% 20%, rgba(99, 102, 241, 0.16) 0%, transparent 60%),
              radial-gradient(circle at 15% 80%, rgba(245, 158, 11, 0.12) 0%, transparent 60%),
              var(--header-bg-gradient, var(--bg-secondary));
  position: sticky;
  top: 0;
  z-index: 40;
  border-bottom: 1px solid var(--border-subtle);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.12);
  transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

[data-theme="dark"] .header-date-group h1 {
  background: linear-gradient(135deg, #ffffff 65%, #a5b4fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

[data-theme="light"] .header-date-group h1 {
  background: linear-gradient(135deg, #0f172a 70%, #4338ca 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-date-group h1 {
  font-size: 1.28rem;
  font-weight: 800;
  letter-spacing: -0.025em;
  color: var(--text-primary);
  line-height: 1.2;
}

.header-date-group p {
  font-size: 0.78rem;
  color: var(--text-secondary);
  font-weight: 500;
  margin-top: 2px;
  letter-spacing: -0.005em;
}

.header-badges {
  display: flex;
  align-items: center;
  gap: 8px;
}

.streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--accent-amber-light);
  border: 1px solid rgba(245, 158, 11, 0.3);
  color: #d97706;
  padding: 5px 11px;
  border-radius: var(--radius-full);
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  box-shadow: 0 2px 6px rgba(245, 158, 11, 0.12);
}

/* Modern Header Theme Toggle Button */
.header-theme-toggle-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  flex-shrink: 0;
}

.header-theme-toggle-btn:hover {
  background: var(--bg-elevated-hover);
  transform: scale(1.05);
}

.header-theme-toggle-btn:active {
  transform: scale(0.92);
}

.header-history-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 6px 12px;
  border-radius: var(--radius-full);
  font-size: 0.76rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.header-history-btn:hover {
  background: var(--bg-elevated-hover);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
  transform: scale(1.03);
}

.header-avatar-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: linear-gradient(135deg, #0284c7, #6366f1);
  color: #ffffff;
  font-weight: 700;
  font-size: 0.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-card);
  box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  flex-shrink: 0;
}

.header-avatar-btn:hover {
  transform: scale(1.08);
}

/* Save Status Banner */
.save-status-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-sm);
  transition: all 0.25s ease;
}

.save-status-banner.draft {
  background: var(--accent-amber-light);
  border-color: rgba(245, 158, 11, 0.3);
  color: #b45309;
}

.save-status-banner.saved {
  background: var(--accent-emerald-light);
  border-color: rgba(16, 185, 129, 0.3);
  color: #047857;
}

.status-chip {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.status-chip.active {
  background: var(--accent-emerald);
  color: #ffffff;
}

.status-chip.draft {
  background: var(--accent-amber);
  color: #ffffff;
}

.status-chip.loss {
  background: #64748b;
  color: #ffffff;
}

/* ==========================================================================
   GENTLER STREAK RADIANT AURA HERO PROGRESS CARD
   ========================================================================== */
.hero-progress-card {
  margin: 14px 20px 18px;
  padding: 22px;
  background: radial-gradient(circle at 90% 10%, rgba(249, 115, 22, 0.12) 0%, transparent 60%),
              radial-gradient(circle at 10% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 60%),
              var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.hero-progress-card.is-won {
  border-color: rgba(16, 185, 129, 0.35);
  background: radial-gradient(circle at 90% 10%, rgba(16, 185, 129, 0.2) 0%, transparent 65%),
              radial-gradient(circle at 10% 90%, rgba(245, 158, 11, 0.12) 0%, transparent 60%),
              var(--bg-card);
  box-shadow: var(--shadow-glow-emerald);
}

.hero-text-block {
  flex: 1;
}

.hero-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  font-weight: 700;
  margin-bottom: 4px;
}

.hero-score-display {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.hero-current-pts {
  font-size: 2.75rem;
  font-weight: 800;
  color: var(--text-primary);
  line-height: 1;
  letter-spacing: -0.04em;
}

.hero-max-pts {
  font-size: 1.08rem;
  color: var(--text-muted);
  font-weight: 600;
}

.hero-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  font-size: 0.76rem;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: var(--radius-full);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  letter-spacing: -0.005em;
  transition: all 0.25s ease;
}

.hero-status-pill.win {
  background: var(--accent-emerald-light);
  color: #047857;
  border-color: rgba(16, 185, 129, 0.35);
  font-weight: 700;
}

/* Circular Progress Ring */
.progress-ring-container {
  width: 90px;
  height: 90px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.progress-ring-svg {
  transform: rotate(-90deg);
  width: 100%;
  height: 100%;
}

.progress-ring-bg {
  stroke: var(--bg-elevated);
  stroke-width: 7;
  fill: transparent;
}

.progress-ring-fill {
  stroke: var(--accent-emerald);
  stroke-width: 7;
  fill: transparent;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.65s cubic-bezier(0.4, 0, 0.2, 1);
}

.progress-ring-text {
  position: absolute;
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

/* ==========================================================================
   BEND PILLOWY HABIT CARDS & SQUIRCLE ICONS
   ========================================================================== */
.section-container {
  padding: 0 20px;
  margin-bottom: 22px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding: 0 2px;
}

.section-title {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-secondary);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-icon-badge {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.section-icon-badge.morning {
  background: rgba(245, 158, 11, 0.14);
  color: #d97706;
}

.section-icon-badge.health {
  background: rgba(16, 185, 129, 0.14);
  color: #059669;
}

.section-icon-badge.focus {
  background: rgba(99, 102, 241, 0.14);
  color: #6366f1;
}

.section-icon-badge.evening {
  background: rgba(139, 92, 246, 0.14);
  color: #8b5cf6;
}

.section-badge {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg-elevated);
  padding: 3px 9px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
}

.task-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Bend Pillowy Task Card */
.task-card {
  background-color: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-sm);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.task-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.task-card:active {
  transform: scale(0.99);
}

.task-card.completed {
  border-color: rgba(16, 185, 129, 0.35);
  background: linear-gradient(135deg, var(--bg-card) 60%, var(--accent-emerald-light));
}

.task-card.rest-day {
  border-color: rgba(2, 132, 199, 0.3);
  background: linear-gradient(135deg, var(--bg-card) 60%, var(--accent-blue-light));
}

.task-main-content {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
}

/* Category Squircles (Bend Style) */
.task-icon-wrapper {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  background-color: var(--bg-elevated);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.task-card.completed .task-icon-wrapper {
  background: var(--accent-emerald);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
}

/* Category Specific Squircle Tints */
.cat-morning .task-icon-wrapper {
  background: rgba(245, 158, 11, 0.12);
  color: #d97706;
}

.cat-fitness .task-icon-wrapper {
  background: rgba(249, 115, 22, 0.12);
  color: #ea580c;
}

.cat-deep_work .task-icon-wrapper {
  background: rgba(99, 102, 241, 0.12);
  color: #6366f1;
}

.cat-health .task-icon-wrapper {
  background: rgba(16, 185, 129, 0.12);
  color: #059669;
}

.cat-evening .task-icon-wrapper {
  background: rgba(139, 92, 246, 0.12);
  color: #7c3aed;
}

.task-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
}

.task-name {
  font-size: 0.94rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.015em;
}

.task-card.completed .task-name {
  color: #047857;
}

.task-meta {
  font-size: 0.76rem;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}

.task-points-pill {
  font-size: 0.72rem;
  font-weight: 700;
  color: #047857;
  background: var(--accent-emerald-light);
  border: 1px solid rgba(16, 185, 129, 0.25);
  padding: 2px 8px;
  border-radius: var(--radius-full);
}

/* Tactile Spring Checkbox (Bend & Gentler Streak) */
.custom-checkbox-btn {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  background: var(--bg-card);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  flex-shrink: 0;
  color: transparent;
}

.custom-checkbox-btn:hover {
  border-color: var(--accent-emerald);
  transform: scale(1.05);
}

.custom-checkbox-btn:active {
  transform: scale(0.9);
}

.custom-checkbox-btn.checked {
  background: var(--accent-emerald);
  border-color: var(--accent-emerald);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
}

/* Water Tracker Liquid Droplets */
.water-tracker-block {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

.water-bubbles-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}

.water-bubble-btn {
  height: 40px;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 0.76rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.water-bubble-btn:hover {
  background: #e0f2fe;
  color: #0284c7;
  transform: scale(1.04);
}

.water-bubble-btn.filled {
  background: linear-gradient(135deg, #0284c7, #0ea5e9);
  color: #ffffff;
  border-color: #0284c7;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
  transform: scale(1.02);
}

/* Focus Timer Inline Controls */
.timer-interactive-block {
  margin-top: 12px;
  padding: 12px 16px;
  border-top: 1px dashed var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-elevated);
  border-radius: var(--radius-md);
}

.timer-countdown-display {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: 0.05em;
}

.timer-btn-group {
  display: flex;
  gap: 8px;
}

.btn-timer {
  padding: 8px 16px;
  font-size: 0.8rem;
  font-weight: 700;
  border-radius: var(--radius-full);
  border: none;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  letter-spacing: -0.01em;
}

.btn-timer-primary {
  background: linear-gradient(135deg, #0284c7, #6366f1);
  color: white;
  box-shadow: 0 3px 10px rgba(2, 132, 199, 0.3);
}

.btn-timer-primary:hover {

  const SafeStorage = {
    _mem: {},
    _checked: false,
    _available: false,
    isAvailable() {
      if (this._checked) return this._available;
      try {
        const testKey = '__wtd_storage_probe__';
        window.localStorage.setItem(testKey, '1');
        window.localStorage.removeItem(testKey);
        this._available = true;
      } catch (e) {
        console.warn('LocalStorage unavailable or restricted on this device. Using robust in-memory fallback.', e);
        this._available = false;
      }
      this._checked = true;
      return this._available;
    },
    getItem(key) {
      if (this.isAvailable()) {
        try {
          const val = window.localStorage.getItem(key);
          if (val !== null) return val;
        } catch (e) {}
      }
      return this._mem[key] !== undefined ? this._mem[key] : null;
    },
    setItem(key, value) {
      const valStr = String(value);
      this._mem[key] = valStr;
      if (this.isAvailable()) {
        try {
          window.localStorage.setItem(key, valStr);
        } catch (e) {
          console.warn('LocalStorage write restricted:', e);
        }
      }
    },
    removeItem(key) {
      delete this._mem[key];
      if (this.isAvailable()) {
        try {
          window.localStorage.removeItem(key);
        } catch (e) {}
      }
    },
    clear() {
      this._mem = {};
      if (this.isAvailable()) {
        try {
          window.localStorage.clear();
        } catch (e) {}
      }
    }
  };

  class Database {
    constructor() {
      this.init();
    }

    init() {
      if (!SafeStorage.getItem(this._k('settings'))) {
        this.saveSettings(DEFAULT_SETTINGS);
      }
      if (!SafeStorage.getItem(this._k('lifetime_stats'))) {
        this.saveLifetimeStats({
          lifetimePoints: 0,
          currentStreak: 0,
          bestStreak: 0,
          totalDaysWon: 0,
          totalDaysTracked: 0
        });
      }
      if (!SafeStorage.getItem(this._k('tasks'))) {
        SafeStorage.setItem(this._k('tasks'), JSON.stringify(TASK_DEFINITIONS));
      } else {
        // Ensure active tasks always sum to 101
        this.getTasks();
      }
    }

    _k(key) {
      return `${DB_KEY_PREFIX}${key}`;
    }

    getSettings() {
      try {
        const data = SafeStorage.getItem(this._k('settings'));
        return data ? { ...DEFAULT_SETTINGS, ...JSON.parse(data) } : DEFAULT_SETTINGS;
      } catch {
        return DEFAULT_SETTINGS;
      }
    }

    saveSettings(settings) {
      SafeStorage.setItem(this._k('settings'), JSON.stringify(settings));
    }

    getProfile() {
      try {
        const raw = SafeStorage.getItem(this._k('user_profile'));
        return raw ? { ...DEFAULT_PROFILE, ...JSON.parse(raw) } : DEFAULT_PROFILE;
      } catch {
        return DEFAULT_PROFILE;
      }
    }

    saveProfile(profile) {
      SafeStorage.setItem(this._k('user_profile'), JSON.stringify(profile));
    }

    calculateBiometrics(profile) {
      const p = profile || this.getProfile();
      const heightM = (Number(p.heightCm) || 175) / 100;
      const weightKg = Number(p.weightKg) || 70;
      const age = Number(p.age) || 25;
      const gender = p.gender || 'male';

      const bmi = parseFloat((weightKg / (heightM * heightM)).toFixed(1));
      let bmiCategory = 'Normal Weight';
      let bmiColor = '#16a34a';
      let bmiBg = 'rgba(22, 163, 74, 0.12)';
      if (bmi < 18.5) {
        bmiCategory = 'Underweight';
        bmiColor = '#0284c7';
        bmiBg = 'rgba(2, 132, 199, 0.12)';
      } else if (bmi < 25) {
        bmiCategory = 'Normal Weight (Optimal)';
        bmiColor = '#16a34a';
        bmiBg = 'rgba(22, 163, 74, 0.12)';
      } else if (bmi < 30) {
        bmiCategory = 'Overweight / Muscular';
        bmiColor = '#f59e0b';
        bmiBg = 'rgba(245, 158, 11, 0.12)';
      } else {
        bmiCategory = 'High BMI';
        bmiColor = '#e11d48';
        bmiBg = 'rgba(225, 29, 72, 0.12)';
      }

      // BMR: Mifflin-St Jeor Formula
      let bmr = (10 * weightKg) + (6.25 * (Number(p.heightCm) || 175)) - (5 * age);
      bmr += (gender === 'female' ? -161 : 5);

      const tdee = Math.round(bmr * (parseFloat(p.activityLevel) || 1.375));
      let goalOffset = 0;
      if (p.fitnessGoal === 'fat_loss') goalOffset = -350;
      else if (p.fitnessGoal === 'muscle_gain') goalOffset = 300;

      const targetCalories = p.customTargetsEnabled && p.customCalories ? Number(p.customCalories) : Math.max(1200, tdee + goalOffset);
      const targetProtein = p.customTargetsEnabled && p.customProtein ? Number(p.customProtein) : Math.round(weightKg * 2.0);
      const targetFat = p.customTargetsEnabled && p.customFat ? Number(p.customFat) : Math.round((targetCalories * 0.25) / 9);
      const targetCarbs = p.customTargetsEnabled && p.customCarbs ? Number(p.customCarbs) : Math.max(50, Math.round((targetCalories - (targetProtein * 4 + targetFat * 9)) / 4));

      return {
        bmi,
        bmiCategory,
        bmiColor,
        bmiBg,
        bmr: Math.round(bmr),
        tdee,
        targetCalories,
        targetProtein,
        targetCarbs,
        targetFat
      };
    }

    getMeals(dateStr) {
      try {
        const raw = SafeStorage.getItem(this._k(`meals_${dateStr}`));
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    saveMeals(dateStr, meals) {
      SafeStorage.setItem(this._k(`meals_${dateStr}`), JSON.stringify(meals));
    }

    addMeal(dateStr, meal) {
      const meals = this.getMeals(dateStr);
      meals.push(meal);
      this.saveMeals(dateStr, meals);
      return meals;
    }

    deleteMeal(dateStr, mealId) {
      let meals = this.getMeals(dateStr);
      meals = meals.filter(m => m.id !== mealId);
      this.saveMeals(dateStr, meals);
      return meals;
    }

    getDailyNutritionTotals(dateStr) {
      const meals = this.getMeals(dateStr);
      let protein = 0;
      let carbs = 0;
      let fat = 0;
      let calories = 0;

      meals.forEach(m => {
        protein += (Number(m.protein) || 0);
        carbs += (Number(m.carbs) || 0);
        fat += (Number(m.fat) || 0);
        calories += (Number(m.calories) || 0);
      });

      return {
        protein: Math.round(protein),
        carbs: Math.round(carbs),
        fat: Math.round(fat),
        calories: Math.round(calories),
        mealCount: meals.length
      };
    }

    rebalanceTasksTo101(tasksList) {
      if (!tasksList || tasksList.length === 0) return [];
      const n = tasksList.length;
      const base = Math.floor(101 / n);
      const remainder = 101 % n;

      return tasksList.map((task, idx) => {
        const pts = idx < remainder ? base + 1 : base;
        return {
          ...task,
          points: pts
        };
      });
    }

    getTasks() {
      try {
        const data = SafeStorage.getItem(this._k('tasks'));
        if (data) {
          const parsed = JSON.parse(data);
          const total = parsed.reduce((sum, t) => sum + (Number(t.points) || 0), 0);
          if (total !== 101 && parsed.length > 0) {
            const balanced = this.rebalanceTasksTo101(parsed);
            this.saveTasks(balanced);
            return balanced;
          }
          return parsed;
        }
        return TASK_DEFINITIONS;
      } catch {
        return TASK_DEFINITIONS;
      }
    }

    saveTasks(tasks) {
      const balanced = this.rebalanceTasksTo101(tasks);
      SafeStorage.setItem(this._k('tasks'), JSON.stringify(balanced));
      return balanced;
    }

    addTask(taskData) {
      const tasks = this.getTasks();
      const newId = taskData.id || `custom_${Date.now()}`;
      const iconSvg = taskData.iconSvg || (taskData.icon ? `<span style="font-size: 1.15rem;">${taskData.icon}</span>` : `🎯`);
      const newTask = {
        id: newId,
        name: taskData.name || 'New Custom Habit',
        category: taskData.category || 'custom',
        points: 0, // Will be rebalanced to exactly 101 total
        isEssential: false,
        type: taskData.type || 'binary',
        icon: taskData.icon || '🎯',
        iconSvg: iconSvg,
        description: taskData.description || 'Custom daily discipline standard'
      };
      tasks.push(newTask);
      return this.saveTasks(tasks);
    }

    updateTask(taskId, updatedFields) {
      const tasks = this.getTasks();
      const idx = tasks.findIndex(t => t.id === taskId);
      if (idx !== -1) {
        if (updatedFields.icon && !updatedFields.iconSvg) {
          updatedFields.iconSvg = `<span style="font-size: 1.15rem;">${updatedFields.icon}</span>`;
        }
        tasks[idx] = { ...tasks[idx], ...updatedFields };
        return this.saveTasks(tasks);
      }
      return null;
    }

    deleteTask(taskId) {
      let tasks = this.getTasks();
      tasks = tasks.filter(t => t.id !== taskId);
      return this.saveTasks(tasks);
    }

    resetDefaultTasks() {
      SafeStorage.setItem(this._k('tasks'), JSON.stringify(TASK_DEFINITIONS));
      return TASK_DEFINITIONS;
    }

    getTotalPossiblePoints() {
      return 101;
    }

    getEffectiveDate(dateObj = new Date()) {
      const settings = this.getSettings();
      const rolloverHour = settings.rolloverHour ?? 3;
      const workingDate = new Date(dateObj);

      if (workingDate.getHours() < rolloverHour) {
        workingDate.setDate(workingDate.getDate() - 1);
      }

      const year = workingDate.getFullYear();
      const month = String(workingDate.getMonth() + 1).padStart(2, '0');
      const day = String(workingDate.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    isDateLocked(dateStr) {
      const effectiveToday = this.getEffectiveDate();
      return dateStr < effectiveToday;
    }

    getDailyLog(dateStr) {
      const raw = SafeStorage.getItem(this._k(`log_${dateStr}`));
      if (raw) {
        try {
          return JSON.parse(raw);
        } catch (e) {
          console.error('Failed to parse daily log', e);
        }
      }
      return this._createInitialDailyLog(dateStr);
    }

    _createInitialDailyLog(dateStr) {
      const dateObj = new Date(`${dateStr}T12:00:00`);
      const dayOfWeek = dateObj.getDay();
      const settings = this.getSettings();
      const isRestDay = (settings.gymRestDays || []).includes(dayOfWeek);

      const taskStates = {};
      const activeTasks = this.getTasks();
      activeTasks.forEach(task => {
        if (task.id === 'workout' && isRestDay) {
          taskStates[task.id] = {
            completed: true,
            isRestDay: true,
            value: 0,
            points: task.points,
            completedAt: null,
            note: 'Scheduled Rest Day'
          };
        } else {
          taskStates[task.id] = {
            completed: false,
            isRestDay: false,
            value: 0,
            points: 0,
            completedAt: null,
            note: ''
          };
        }
      });

      return {
        date: dateStr,
        taskStates,
        waterMl: 0,
        timerSeconds: 0,
        wakeTimeLogged: null,
        bedTimeLogged: null,
        basePointsEarned: isRestDay ? (activeTasks.find(t => t.id === 'workout')?.points || 15) : 0,
        streakBonusEarned: 0,
        penaltiesIncurred: 0,
        totalPoints: isRestDay ? (activeTasks.find(t => t.id === 'workout')?.points || 15) : 0,
        isWon: false,
        isSaved: false,
        savedAt: null,
        notes: '',
        updatedAt: new Date().toISOString()
      };
    }

    saveDailyLog(dateStr, logData) {
      logData.updatedAt = new Date().toISOString();
      SafeStorage.setItem(this._k(`log_${dateStr}`), JSON.stringify(logData));

      const dateIndex = this.getDateIndex();
      if (!dateIndex.includes(dateStr)) {
        dateIndex.push(dateStr);
        dateIndex.sort();
        SafeStorage.setItem(this._k('date_index'), JSON.stringify(dateIndex));
      }
    }

    saveDraft(dateStr, draftData) {
      SafeStorage.setItem(this._k(`draft_${dateStr}`), JSON.stringify(draftData));
    }

    getDraft(dateStr) {
      const raw = SafeStorage.getItem(this._k(`draft_${dateStr}`));
      if (raw) {
        try {
          return JSON.parse(raw);
        } catch {}
      }
      return null;
    }

    getDateIndex() {
      try {
        const raw = SafeStorage.getItem(this._k('date_index'));
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    getLifetimeStats() {
      try {
        const raw = SafeStorage.getItem(this._k('lifetime_stats'));
        return raw ? JSON.parse(raw) : {
          lifetimePoints: 0,
          currentStreak: 0,
          bestStreak: 0,
          totalDaysWon: 0,
          totalDaysTracked: 0
        };
      } catch {
        return {
          lifetimePoints: 0,
          currentStreak: 0,
          bestStreak: 0,
          totalDaysWon: 0,
          totalDaysTracked: 0
        };
      }
    }

    saveLifetimeStats(stats) {
      SafeStorage.setItem(this._k('lifetime_stats'), JSON.stringify(stats));
    }

    recalculateLifetimeStats() {
      const dates = this.getDateIndex().sort();
      let currentStreak = 0;
      let bestStreak = 0;
      let lifetimePoints = 0;
      let totalDaysWon = 0;

      dates.forEach(dateStr => {
        const log = this.getDailyLog(dateStr);
        if (log.isSaved) {
          lifetimePoints += (log.totalPoints || 0);

          if (log.isWon) {
            currentStreak++;
            totalDaysWon++;
            if (currentStreak > bestStreak) {
              bestStreak = currentStreak;
            }
          } else {
            currentStreak = 0;
          }
        }
      });

      const stats = {
        lifetimePoints,
        currentStreak,
        bestStreak,
        totalDaysWon,
        totalDaysTracked: dates.filter(d => this.getDailyLog(d).isSaved).length
      };
      this.saveLifetimeStats(stats);
      return stats;
    }

    clearAllData() {
      const settings = this.getSettings();
      const profile = this.getProfile();
      SafeStorage.clear();
      this.saveSettings(settings);
      this.saveProfile(profile);
      this.saveLifetimeStats({
        lifetimePoints: 0,
        currentStreak: 0,
        bestStreak: 0,
        totalDaysWon: 0,
        totalDaysTracked: 0
      });
      SafeStorage.setItem(this._k('tasks'), JSON.stringify(TASK_DEFINITIONS));
      SafeStorage.setItem(this._k('date_index'), JSON.stringify([]));
    }

    exportFullBackup() {
      const backup = {
        version: DB_VERSION,
        exportTimestamp: new Date().toISOString(),
        settings: this.getSettings(),
        profile: this.getProfile(),
        lifetimeStats: this.getLifetimeStats(),
        tasks: this.getTasks(),
        dateIndex: this.getDateIndex(),
        logs: {},
        meals: {}
      };

      backup.dateIndex.forEach(date => {
        backup.logs[date] = this.getDailyLog(date);
        backup.meals[date] = this.getMeals(date);
      });

      return JSON.stringify(backup, null, 2);
    }

    importFullBackup(jsonString) {
      try {
        const backup = JSON.parse(jsonString);
        if (!backup.version || !backup.settings) {
          throw new Error('Invalid backup schema');
        }

        this.saveSettings(backup.settings);
        if (backup.profile) this.saveProfile(backup.profile);
        if (backup.lifetimeStats) this.saveLifetimeStats(backup.lifetimeStats);
        if (backup.tasks) SafeStorage.setItem(this._k('tasks'), JSON.stringify(backup.tasks));

        if (Array.isArray(backup.dateIndex)) {
          SafeStorage.setItem(this._k('date_index'), JSON.stringify(backup.dateIndex));
        }

        if (backup.logs) {
          Object.entries(backup.logs).forEach(([date, log]) => {
            SafeStorage.setItem(this._k(`log_${date}`), JSON.stringify(log));
          });
        }

        if (backup.meals) {
          Object.entries(backup.meals).forEach(([date, meals]) => {
            SafeStorage.setItem(this._k(`meals_${date}`), JSON.stringify(meals));
          });
        }

        this.recalculateLifetimeStats();
        return { success: true, message: `Imported ${backup.dateIndex?.length || 0} days of history successfully.` };
      } catch (err) {
        return { success: false, message: err.message };
      }
    }
  }

  // ==========================================
  // 3. SCORING & DEDUCTION ENGINE
  // ==========================================
  class ScoringEngine {
    constructor(db) {
      this.db = db;
    }

    calculateTimePenalty(diffMinutes) {
      if (diffMinutes <= 0) return 0;
      if (diffMinutes <= 30) return 2;
      if (diffMinutes <= 45) return 3;
      if (diffMinutes <= 60) return 4;
      return 5; // 60-120 mins or more
    }

    evaluateWakeTime(wakeTimeStr, targetWakeStr) {
      if (!wakeTimeStr || !targetWakeStr) return { isMet: false, isLogged: false, diffMinutes: 0, penalty: 5 };
      const [wH, wM] = wakeTimeStr.split(':').map(Number);
      const [tH, tM] = targetWakeStr.split(':').map(Number);
      const wakeMins = wH * 60 + wM;
      const targetMins = tH * 60 + tM;
      const diffMinutes = wakeMins - targetMins;
      const isMet = diffMinutes <= 0;
      const penalty = isMet ? 0 : this.calculateTimePenalty(diffMinutes);
      return { isMet, isLogged: true, diffMinutes, penalty };
    }

    evaluateBedTime(bedTimeStr, targetBedStr) {
      if (!bedTimeStr || !targetBedStr) return { isMet: false, isLogged: false, isPastMidnight: false, diffMinutes: 0, penalty: 5 };
      const [bH, bM] = bedTimeStr.split(':').map(Number);
      const [tH, tM] = targetBedStr.split(':').map(Number);

      const adjustedBedHour = bH < 4 ? bH + 24 : bH;
      const adjustedTargetHour = tH < 4 ? tH + 24 : tH;

      const bedMins = adjustedBedHour * 60 + bM;
      const targetMins = adjustedTargetHour * 60 + tM;
      const diffMinutes = bedMins - targetMins;

      const isPastMidnight = adjustedBedHour >= 24;
      const isMet = diffMinutes <= 0 && !isPastMidnight;
      const penalty = isMet ? 0 : this.calculateTimePenalty(Math.max(1, diffMinutes));

      return { isMet, isLogged: true, isPastMidnight, diffMinutes, penalty };
    }

    evaluateDailyScore(dailyLog) {
      const settings = this.db.getSettings();
      const tasks = this.db.getTasks();
      const winThreshold = settings.winThreshold || 80;

      let basePoints = 0;
      let totalPenalties = 0;

      const getTask = (id) => tasks.find(t => t.id === id);

      // 1. Wake Time - ONLY penalize if a wake time is actually logged and late
      const wakeTask = getTask('wake_up');
      const wakeMaxPts = wakeTask ? (Number(wakeTask.points) || 15) : 15;

      if (!dailyLog.taskStates['wake_up']) dailyLog.taskStates['wake_up'] = {};

      if (dailyLog.wakeTimeLogged) {
        const wakeEval = this.evaluateWakeTime(dailyLog.wakeTimeLogged, settings.targetWakeTime);
        if (wakeEval.isMet) {
          dailyLog.taskStates['wake_up'].completed = true;
          dailyLog.taskStates['wake_up'].points = wakeMaxPts;
          basePoints += wakeMaxPts;
        } else {
          dailyLog.taskStates['wake_up'].completed = false;
          dailyLog.taskStates['wake_up'].points = 0;
          totalPenalties += wakeEval.penalty;
        }
      } else {
        dailyLog.taskStates['wake_up'].completed = false;
        dailyLog.taskStates['wake_up'].points = 0;
      }

      // 2. Bedtime - ONLY penalize if bedtime is actually logged (auto-recorded on save) and late
      const sleepTask = getTask('sleep_on_time');
      const sleepMaxPts = sleepTask ? (Number(sleepTask.points) || 14) : 14;

      if (!dailyLog.taskStates['sleep_on_time']) dailyLog.taskStates['sleep_on_time'] = {};

      if (dailyLog.bedTimeLogged) {
        const sleepEval = this.evaluateBedTime(dailyLog.bedTimeLogged, settings.targetBedTime);
        if (sleepEval.isMet) {
          dailyLog.taskStates['sleep_on_time'].completed = true;
          dailyLog.taskStates['sleep_on_time'].points = sleepMaxPts;
          basePoints += sleepMaxPts;
        } else {
          dailyLog.taskStates['sleep_on_time'].completed = false;
          dailyLog.taskStates['sleep_on_time'].points = 0;
          totalPenalties += sleepEval.penalty;
        }
      } else {
        dailyLog.taskStates['sleep_on_time'].completed = false;
        dailyLog.taskStates['sleep_on_time'].points = 0;
      }

      // 3. Other tasks - Completed gives points, uncompleted gives 0 (no premature penalties)
      tasks.forEach(task => {
        if (task.id === 'wake_up' || task.id === 'sleep_on_time') return;

        if (!dailyLog.taskStates[task.id]) {
          dailyLog.taskStates[task.id] = { completed: false, isRestDay: false, value: 0, points: 0 };
        }

        const state = dailyLog.taskStates[task.id];
        if (state && (state.completed || state.isRestDay)) {
          state.points = Number(task.points) || 0;
          basePoints += state.points;
        } else if (state) {
          state.points = 0;
        }
      });

      const isWon = basePoints >= winThreshold;
      const penalties = totalPenalties;
      // Maximum points in a day is strictly capped at 101 points (NO bonus points added to score)
      const totalPoints = Math.min(101, Math.max(0, basePoints - penalties));

      dailyLog.basePointsEarned = Math.min(101, basePoints);
      dailyLog.streakBonusEarned = 0;
      dailyLog.penaltiesIncurred = penalties;
      dailyLog.totalPoints = totalPoints;
      dailyLog.isWon = isWon;

      return dailyLog;
    }

    getCompletionPercentage(dailyLog) {
      const maxScore = 101;
      const current = dailyLog.totalPoints || 0;
      return Math.min(100, Math.round((current / maxScore) * 100));
    }
  }

  // ==========================================
  // 4. FOCUS TIMER ENGINE (60-MIN COMPANION)
  // ==========================================
  class FocusTimer {
    constructor(options = {}) {
      this.targetDurationSeconds = (options.targetMinutes || 60) * 60;
      this.onTick = options.onTick || (() => {});
      this.onComplete = options.onComplete || (() => {});
      this.onStateChange = options.onStateChange || (() => {});

      this.isRunning = false;
      this.elapsedSeconds = 0;
      this.startTimestamp = null;
      this.accumulatedBeforeStart = 0;
      this.intervalId = null;
    }

    loadState(savedElapsedSeconds = 0) {
      this.elapsedSeconds = Math.min(this.targetDurationSeconds, savedElapsedSeconds);
      this.accumulatedBeforeStart = this.elapsedSeconds;
      this.onTick(this.getRemainingSeconds(), this.getProgressPercent(), this.getElapsedSeconds());
    }

    start() {
      if (this.isRunning) return;
      this.isRunning = true;
      this.startTimestamp = Date.now();
      this.onStateChange(true);

      this.intervalId = setInterval(() => {
        this._update();
      }, 500);
      this._update();
    }

    pause() {
      if (!this.isRunning) return;
      this.isRunning = false;
      if (this.startTimestamp) {
        const now = Date.now();
        const sessionSeconds = Math.floor((now - this.startTimestamp) / 1000);
        this.accumulatedBeforeStart += sessionSeconds;
      }
      this.startTimestamp = null;
      clearInterval(this.intervalId);
      this.intervalId = null;
      this.onStateChange(false);
      this.onTick(this.getRemainingSeconds(), this.getProgressPercent(), this.getElapsedSeconds());
    }

    reset() {
      this.pause();
      this.accumulatedBeforeStart = 0;
      this.elapsedSeconds = 0;
      this.startTimestamp = null;
      this.onTick(this.getRemainingSeconds(), this.getProgressPercent(), this.getElapsedSeconds());
    }

    _update() {
      if (!this.isRunning) return;
      const now = Date.now();
      const sessionSeconds = Math.floor((now - this.startTimestamp) / 1000);
      this.elapsedSeconds = Math.min(this.targetDurationSeconds, this.accumulatedBeforeStart + sessionSeconds);

      const remaining = this.getRemainingSeconds();
      const progress = this.getProgressPercent();

      this.onTick(remaining, progress, this.elapsedSeconds);

      if (this.elapsedSeconds >= this.targetDurationSeconds) {
        this.pause();
        this.onComplete();
      }
    }

    getElapsedSeconds() {
      if (this.isRunning && this.startTimestamp) {
        const sessionSeconds = Math.floor((Date.now() - this.startTimestamp) / 1000);
        return Math.min(this.targetDurationSeconds, this.accumulatedBeforeStart + sessionSeconds);
      }
      return this.accumulatedBeforeStart;
    }

    getRemainingSeconds() {
      return Math.max(0, this.targetDurationSeconds - this.getElapsedSeconds());
    }

    getProgressPercent() {
      const elapsed = this.getElapsedSeconds();
      return Math.min(100, Math.round((elapsed / this.targetDurationSeconds) * 100));
    }

    formatTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
  }

  // ==========================================
  // 5. AUDIO & HAPTICS ENGINE
  // ==========================================
  class FeedbackEngine {
    constructor(db) {
      this.db = db;
      this.audioCtx = null;
    }

    _getAudioContext() {
      if (!this.audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          this.audioCtx = new AudioContext();
        }
      }
      if (this.audioCtx && this.audioCtx.state === 'suspended') {
        this.audioCtx.resume();
      }
      return this.audioCtx;
    }

    vibrate(pattern = [30]) {
      const settings = this.db.getSettings();
      if (settings.hapticsEnabled !== false && 'vibrate' in navigator) {
        try {
          navigator.vibrate(pattern);
        } catch {}
      }
    }

    playTaskComplete() {
      const settings = this.db.getSettings();
      if (settings.soundEnabled === false) return;
      this.vibrate([35]);

      try {
        const ctx = this._getAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
      } catch {}
    }

    playWaterSip() {
      const settings = this.db.getSettings();
      if (settings.soundEnabled === false) return;
      this.vibrate([20]);

      try {
        const ctx = this._getAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(660, now + 0.08);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.15);
      } catch {}
    }

    playDayWonFanfare() {
      const settings = this.db.getSettings();
      if (settings.soundEnabled === false) return;
      this.vibrate([80, 50, 120, 50, 200]);

      try {
        const ctx = this._getAudioContext();
        if (!ctx) return;

        const notes = [
          { f: 523.25, d: 0.12, pause: 0.0 },
          { f: 659.25, d: 0.12, pause: 0.12 },
          { f: 783.99, d: 0.15, pause: 0.24 },
          { f: 1046.50, d: 0.45, pause: 0.39 }
        ];

        const now = ctx.currentTime;
        notes.forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.f, now + note.pause);
          gain.gain.setValueAtTime(0.18, now + note.pause);
          gain.gain.exponentialRampToValueAtTime(0.001, now + note.pause + note.d);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + note.pause);
          osc.stop(now + note.pause + note.d);
        });
      } catch {}
    }
  }

  // ==========================================
  // 6. CANVAS CONFETTI CELEBRATION
  // ==========================================
  function triggerConfetti(durationMs = 2500) {
    let canvas = document.getElementById('wtd-confetti-canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'wtd-confetti-canvas';
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '9999';
      document.body.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    const particles = [];
    const colors = ['#10b981', '#0284c7', '#f59e0b', '#ec4899', '#8b5cf6', '#3b82f6'];

    for (let i = 0; i < 110; i++) {
      particles.push({
        x: canvas.width / 2 + (Math.random() * 80 - 40) * dpr,
        y: canvas.height * 0.4 + (Math.random() * 40 - 20) * dpr,
        vx: (Math.random() * 14 - 7) * dpr,
        vy: (Math.random() * -16 - 8) * dpr,
        size: (Math.random() * 7 + 4) * dpr,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rotationSpeed: Math.random() * 12 - 6,
        gravity: 0.4 * dpr,
        opacity: 1,
        decay: Math.random() * 0.015 + 0.01
      });
    }

    const startTime = Date.now();
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const elapsed = Date.now() - startTime;
      let activeCount = 0;

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rotation += p.rotationSpeed;
        p.opacity -= p.decay;

        if (p.opacity > 0) {
          activeCount++;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        }
      });

      if (activeCount > 0 && elapsed < durationMs) {
        requestAnimationFrame(animate);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    animate();
  }

  // ==========================================
  // 7. ANALYTICS & CONSISTENCY ENGINE
  // ==========================================
  class AnalyticsEngine {
    constructor(db, scoringEngine) {
      this.db = db;
      this.scoringEngine = scoringEngine;
    }

    generateHeatmapData(weeksCount = 16) {
      const today = new Date();
      const effectiveToday = this.db.getEffectiveDate(today);
      const dateIndex = this.db.getDateIndex();

      const endDate = new Date(`${effectiveToday}T12:00:00`);
      const endDayOfWeek = endDate.getDay();

      const totalDays = (weeksCount * 7) + (endDayOfWeek + 1);
      const startDate = new Date(endDate);
      startDate.setDate(endDate.getDate() - totalDays + 1);
      startDate.setDate(startDate.getDate() - startDate.getDay());

      const days = [];
      const curr = new Date(startDate);

      while (curr <= endDate) {
        const year = curr.getFullYear();
        const month = String(curr.getMonth() + 1).padStart(2, '0');
        const day = String(curr.getDate()).padStart(2, '0');
        const dateStr = `${year}-${month}-${day}`;

        const log = dateIndex.includes(dateStr) ? this.db.getDailyLog(dateStr) : null;
        const isSaved = log ? log.isSaved : false;
        const score = (log && isSaved) ? (log.totalPoints || 0) : null;
        const isWon = log ? log.isWon : false;

        let level = 0;
        if (score !== null) {
          if (score >= 100) level = 4;
          else if (score >= 80) level = 3;
          else if (score >= 50) level = 2;
          else if (score > 0) level = 1;
          else level = 0;
        }

        days.push({
          date: dateStr,
          dayOfWeek: curr.getDay(),
          score,
          isWon,
          level,
          hasLog: !!(log && isSaved)
        });

        curr.setDate(curr.getDate() + 1);
      }

      return days;
    }

    renderHeatmapSvg(containerEl, weeksCount = 16, onCellClick = null) {
      const days = this.generateHeatmapData(weeksCount);
      if (!days.length) return;

      const cellSize = 13;
      const cellGap = 3.5;
      const step = cellSize + cellGap;

      const weeks = [];
      let currentWeek = [];

      days.forEach((day, idx) => {
        currentWeek.push(day);
        if (day.dayOfWeek === 6 || idx === days.length - 1) {
          weeks.push(currentWeek);
          currentWeek = [];
        }
      });

      const width = weeks.length * step + 10;
      const height = 7 * step + 10;

      const colors = {
        0: '#e2e8f0',
        1: '#bbf7d0',
        2: '#4ade80',
        3: '#16a34a',
        4: '#15803d'
      };

      let svg = `<svg viewBox="0 0 ${width} ${height}" class="w-full h-auto overflow-visible select-none">`;

      weeks.forEach((week, wIdx) => {
        const x = wIdx * step;
        week.forEach(day => {
          const y = day.dayOfWeek * step;
          const color = colors[day.level];
          const stroke = day.level === 4 ? '#14532d' : '#cbd5e1';
          const tooltip = day.hasLog
            ? `${day.date}: ${day.score} pts ${day.isWon ? '(WIN 🔥)' : ''}`
            : `${day.date}: No saved entry`;

          svg += `<rect 
            x="${x}" 
            y="${y}" 
            width="${cellSize}" 
            height="${cellSize}" 
            rx="3" 
            fill="${color}" 
            stroke="${stroke}" 
            stroke-width="0.5"
            class="heatmap-cell transition-all cursor-pointer hover:opacity-80" 
            data-date="${day.date}"
            data-score="${day.score ?? 0}"
            data-won="${day.isWon}"
          >
            <title>${tooltip}</title>
          </rect>`;
        });
      });

      svg += '</svg>';
      containerEl.innerHTML = svg;

      if (onCellClick) {
        containerEl.querySelectorAll('.heatmap-cell').forEach(cell => {
          cell.addEventListener('click', () => {
            const date = cell.getAttribute('data-date');
            onCellClick(date);
          });
        });
      }
    }

    getLast7DaysData() {
      const today = new Date();
      const effectiveToday = this.db.getEffectiveDate(today);
      const dateIndex = this.db.getDateIndex();

      const days = [];
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      for (let i = 6; i >= 0; i--) {
        const d = new Date(`${effectiveToday}T12:00:00`);
        d.setDate(d.getDate() - i);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const dateStr = `${year}-${month}-${day}`;

        const log = dateIndex.includes(dateStr) ? this.db.getDailyLog(dateStr) : null;
        const isSaved = log ? log.isSaved : false;
        const score = (log && isSaved) ? Math.min(101, Math.max(0, log.totalPoints || 0)) : 0;
        const isWon = log ? log.isWon : false;

        days.push({
          date: dateStr,
          dayName: dayNames[d.getDay()],
          score,
          isWon: isSaved && isWon,
          isSaved,
          percent: Math.min(100, Math.round((score / 101) * 100))
        });
      }

      return days;
    }

    getTaskCompletionRates(daysLookback = 30) {
      const dates = this.db.getDateIndex().slice(-daysLookback);
      const tasks = this.db.getTasks();

      if (dates.length === 0) {
        return tasks.map(t => ({ task: t, rate: 0, completedCount: 0, totalCount: 0 }));
      }

      const taskCounts = {};
      tasks.forEach(t => {
        taskCounts[t.id] = { completed: 0, total: 0 };
      });

      let validDays = 0;
      dates.forEach(dateStr => {
        const log = this.db.getDailyLog(dateStr);
        if (log.isSaved) {
          validDays++;
          tasks.forEach(t => {
            const state = log.taskStates?.[t.id];
            taskCounts[t.id].total++;
            if (state && (state.completed || state.isRestDay)) {
              taskCounts[t.id].completed++;
            }
          });
        }
      });

      return tasks.map(t => {
        const counts = taskCounts[t.id] || { completed: 0, total: 0 };
        const rate = counts.total > 0 ? Math.round((counts.completed / counts.total) * 100) : 0;
        return {
          task: t,
          rate,
          completedCount: counts.completed,
          totalCount: counts.total
        };
      });
    }

    getOverallStats() {
      const lifetime = this.db.getLifetimeStats();
      const dates = this.db.getDateIndex();
      
      let savedDays = 0;
      let totalPointsAccumulated = 0;

      dates.forEach(d => {
        const log = this.db.getDailyLog(d);
        if (log.isSaved) {
          savedDays++;
          totalPointsAccumulated += (log.totalPoints || 0);
        }
      });

      const totalWins = lifetime.totalDaysWon || 0;
      const winRate = savedDays > 0 ? Math.round((totalWins / savedDays) * 100) : 0;

      return {
        currentStreak: lifetime.currentStreak || 0,
        bestStreak: lifetime.bestStreak || 0,
        totalDaysWon: totalWins,
        totalDaysTracked: savedDays,
        winRate,
        lifetimePoints: lifetime.lifetimePoints || totalPointsAccumulated
      };
    }
  }

  class UIManager {
    constructor(db, scoringEngine, focusTimer, analyticsEngine, feedbackEngine) {
      this.db = db;
      this.scoringEngine = scoringEngine;
      this.focusTimer = focusTimer;
      this.analyticsEngine = analyticsEngine;
      this.feedbackEngine = feedbackEngine;

      this.currentTab = 'today';
      this.currentDate = this.db.getEffectiveDate();
      
      const draft = this.db.getDraft(this.currentDate);
      this.currentLog = draft || this.db.getDailyLog(this.currentDate);
      this.currentLog = this.scoringEngine.evaluateDailyScore(this.currentLog);
      this.validationError = null;

      this.initTimerHooks();
    }

    initTimerHooks() {
      this.focusTimer.onTick = (remainingSecs, progressPercent, elapsedSecs) => {
        const countdownEl = document.getElementById('timer-countdown-text');
        if (countdownEl) {
          countdownEl.textContent = this.focusTimer.formatTime(remainingSecs);
        }
        this.currentLog.timerSeconds = elapsedSecs;
        this.db.saveDraft(this.currentDate, this.currentLog);
      };

      this.focusTimer.onComplete = () => {
        this.feedbackEngine.playDayWonFanfare();
        this.feedbackEngine.vibrate([100, 100, 100]);
        this.toggleTask('personal_project', true, 60);
      };

      this.focusTimer.onStateChange = (isRunning) => {
        const playBtn = document.getElementById('timer-toggle-btn');
        if (playBtn) {
          playBtn.textContent = isRunning ? '⏸ Pause' : '▶ Start 1h Timer';
          playBtn.className = isRunning ? 'btn-timer btn-timer-secondary' : 'btn-timer btn-timer-primary';
        }
      };
    }

    render() {
      const mainContainer = document.getElementById('main-content');
      if (!mainContainer) return;

      this.currentDate = this.db.getEffectiveDate();
      this.renderHeader();

      if (this.currentTab === 'today') {
        mainContainer.innerHTML = this.renderTodayView();
        this.attachTodayListeners();
      } else if (this.currentTab === 'consistency') {
        mainContainer.innerHTML = this.renderConsistencyView();
        this.attachConsistencyListeners();
      } else if (this.currentTab === 'history') {
        mainContainer.innerHTML = this.renderHistoryArchiveView();
        this.attachHistoryArchiveListeners();
      } else if (this.currentTab === 'profile') {
        mainContainer.innerHTML = this.renderProfileView();
        this.attachProfileListeners();
      } else if (this.currentTab === 'settings') {

        this.attachSettingsListeners();

              </div>
            </div>

            <button type="button" class="btn-timer btn-timer-primary" id="btn-open-nutrition-modal" style="width: 100%; padding: 8px 12px; font-size: 0.82rem; display: flex; align-items: center; justify-content: center; gap: 6px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
              <span id="nutrition-modal-btn-label">🍽️ Log Meals & Macro Calculator (${totals.mealCount} Logged)</span>
            </button>
          </div>
        `;
      } else if (task.id === 'personal_project') {
        const remainingSecs = this.focusTimer.getRemainingSeconds();
        const formattedTime = this.focusTimer.formatTime(remainingSecs);
        extraControl = `
          <div class="timer-interactive-block">
            <div class="timer-countdown-display" id="timer-countdown-text">${formattedTime}</div>
            <div class="timer-btn-group">
              <button type="button" class="btn-timer btn-timer-primary" id="timer-toggle-btn">▶ Start 1h Timer</button>
              <button type="button" class="btn-timer btn-timer-secondary" id="timer-reset-btn">↺ Reset</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="task-card cat-${task.category} ${isCompleted ? 'completed' : ''} ${isRestDay ? 'rest-day' : ''}" id="task-card-${task.id}" data-task-id="${task.id}">
          <div style="width: 100%;">
            <div style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;" class="task-header-row" data-header-task-id="${task.id}">
              <div class="task-main-content">
                <div class="task-icon-wrapper" id="task-icon-${task.id}">${task.iconSvg || '✓'}</div>
                <div class="task-info">
                  <div class="task-name">${task.name}</div>
                  <div class="task-meta">
                    <span class="task-points-pill">+${task.points} pts</span>
                    ${isRestDay ? '<span style="color: #0284c7; font-weight: 700;">(Rest Day Credited)</span>' : ''}
                  </div>
                </div>
              </div>

              ${(task.id !== 'wake_up' && task.id !== 'sleep_on_time') ? `
                <button type="button" class="custom-checkbox-btn ${isCompleted ? 'checked' : ''}" id="check-btn-${task.id}" data-btn-task-id="${task.id}" title="Toggle Complete">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
              ` : `
                <div style="font-size: 0.82rem; font-weight: 700; color: ${isCompleted ? '#16a34a' : '#94a3b8'};" id="time-status-pill-${task.id}">
                  ${isCompleted ? '✓ Done' : '○'}
                </div>
              `}
            </div>
            ${extraControl}
          </div>
        </div>
      `;
    }

    attachTodayListeners() {
      // 1. Task Card & Checkbox Toggles
      document.querySelectorAll('.task-header-row').forEach(row => {
        row.addEventListener('click', (e) => {
          const taskId = row.getAttribute('data-header-task-id');
          if (taskId === 'wake_up' || taskId === 'sleep_on_time') {
            return;
          }
          const currentState = this.currentLog.taskStates[taskId]?.completed || false;
          this.toggleTask(taskId, !currentState);
        });
      });

      document.querySelectorAll('.custom-checkbox-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const taskId = btn.getAttribute('data-btn-task-id');
          const currentState = this.currentLog.taskStates[taskId]?.completed || false;
          this.toggleTask(taskId, !currentState);
        });
      });

      // 2. Wake-Up Time Input
      const wakeInput = document.getElementById('wake-time-inline-input');
      if (wakeInput) {
        const handleWakeChange = () => {
          const val = wakeInput.value;
          this.currentLog.wakeTimeLogged = val || null;
          this.hideValidation();
          if (val) {
            this.feedbackEngine.playTaskComplete();
          }
          this.updateLiveScoresAndStatus();
        };
        wakeInput.addEventListener('input', handleWakeChange);
        wakeInput.addEventListener('change', handleWakeChange);
      }

      // 4. Water Bubbles
      document.querySelectorAll('[data-water-val]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetMl = parseInt(btn.getAttribute('data-water-val'), 10);
          this.feedbackEngine.playWaterSip();
          this.setWaterProgress(targetMl);
        });
      });

      // 5. Timer Controls
      const timerToggleBtn = document.getElementById('timer-toggle-btn');
      if (timerToggleBtn) {
        timerToggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (this.focusTimer.isRunning) {
            this.focusTimer.pause();
          } else {
            this.focusTimer.start();
          }
        });
      }

      const timerResetBtn = document.getElementById('timer-reset-btn');
      if (timerResetBtn) {
        timerResetBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.focusTimer.reset();
          this.currentLog.timerSeconds = 0;
          this.db.saveDraft(this.currentDate, this.currentLog);
        });
      }

      // 6. Nutrition Modal Button
      const nutritionBtn = document.getElementById('btn-open-nutrition-modal');
      if (nutritionBtn) {
        nutritionBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.feedbackEngine.vibrate([15]);
          this.openNutritionModal();
        });
      }

      // Auto-save is continuous; manual finalize is in Settings
    }

    toggleTask(taskId, completed, customValue = null) {
      if (taskId === 'drink_water') {
        this.setWaterProgress(completed ? 3000 : 0);
        return;
      }

      const task = this.db.getTasks().find(t => t.id === taskId);
      if (!task) return;

      if (!this.currentLog.taskStates[taskId]) {
        this.currentLog.taskStates[taskId] = { completed: false, isRestDay: false, value: 0 };
      }

      this.currentLog.taskStates[taskId].completed = completed;
      this.currentLog.taskStates[taskId].points = completed ? task.points : 0;
      this.currentLog.taskStates[taskId].completedAt = completed ? new Date().toISOString() : null;

      if (customValue !== null) {
        this.currentLog.taskStates[taskId].value = customValue;
      }

      const card = document.getElementById(`task-card-${taskId}`);
      const btn = document.getElementById(`check-btn-${taskId}`);
      if (card) card.classList.toggle('completed', completed);
      if (btn) btn.classList.toggle('checked', completed);

      if (completed) {
        this.feedbackEngine.playTaskComplete();
      }

      this.hideValidation();
      this.updateLiveScoresAndStatus();
    }

    setWaterProgress(ml) {
      this.currentLog.waterMl = ml;
      const isCompleted = ml >= 3000;

      if (!this.currentLog.taskStates['drink_water']) {
        this.currentLog.taskStates['drink_water'] = { completed: false, isRestDay: false, value: 0 };
      }
      this.currentLog.taskStates['drink_water'].completed = isCompleted;
      const waterTask = this.db.getTasks().find(t => t.id === 'drink_water');
      this.currentLog.taskStates['drink_water'].points = isCompleted ? (waterTask ? Number(waterTask.points) || 14 : 14) : 0;
      this.currentLog.taskStates['drink_water'].value = ml;
      this.currentLog.taskStates['drink_water'].completedAt = isCompleted ? new Date().toISOString() : null;

      document.querySelectorAll('[data-water-val]').forEach(btn => {
        const bubbleVal = parseInt(btn.getAttribute('data-water-val'), 10);
        btn.classList.toggle('filled', bubbleVal <= ml);
      });

      const waterStatus = document.getElementById('water-status-text');
      if (waterStatus) {
        waterStatus.style.color = isCompleted ? '#16a34a' : 'var(--text-secondary)';
        waterStatus.innerHTML = `
          <span>Hydration: <b>${ml} / 3000 ml</b></span>
          <span>${isCompleted ? '✅ 3L Goal Met (+10 pts)' : '(Tap bubbles to log)'}</span>
        `;
      }

      const card = document.getElementById('task-card-drink_water');
      if (card) card.classList.toggle('completed', isCompleted);

      const checkBtn = document.getElementById('check-btn-drink_water');
      if (checkBtn) checkBtn.classList.toggle('checked', isCompleted);

      if (isCompleted) {
        this.feedbackEngine.playTaskComplete();
      }

      this.hideValidation();
      this.updateLiveScoresAndStatus();
    }

    updateLiveScoresAndStatus() {
      this.currentLog = this.scoringEngine.evaluateDailyScore(this.currentLog);
      this.db.saveDraft(this.currentDate, this.currentLog);

      const score = this.currentLog.totalPoints || 0;
      const isWon = this.currentLog.isWon;
      const settings = this.db.getSettings();

      const heroPts = document.getElementById('hero-pts');
      if (heroPts) heroPts.textContent = score;

      const heroPill = document.getElementById('hero-status-pill');
      if (heroPill) {
        heroPill.className = `hero-status-pill ${isWon ? 'win' : ''}`;
        heroPill.textContent = isWon ? '✨ Day Won! (+1 Streak Bonus Earned)' : `🎯 Goal: ${settings.winThreshold || 80} pts to Win the Day`;
      }

      const circumference = 201;
      const progressPercent = this.scoringEngine.getCompletionPercentage(this.currentLog);
      const strokeDashoffset = circumference - (progressPercent / 100) * circumference;

      const ringFill = document.getElementById('hero-ring-fill');
      const ringText = document.getElementById('hero-percent');
      if (ringFill) ringFill.style.strokeDashoffset = strokeDashoffset;
      if (ringText) ringText.textContent = `${progressPercent}%`;

      const heroCard = document.getElementById('hero-progress-card');
      if (heroCard) heroCard.classList.toggle('is-won', isWon);

      const penaltyBox = document.getElementById('hero-penalty-notice');
      if (penaltyBox) {
        penaltyBox.style.display = this.currentLog.penaltiesIncurred > 0 ? 'block' : 'none';
        penaltyBox.textContent = `⚠️ -${this.currentLog.penaltiesIncurred} pts penalty for late recorded time`;
      }

      const wakeLabel = document.getElementById('wake-status-label');
      const wakeCard = document.getElementById('task-card-wake_up');
      const wakePill = document.getElementById('time-status-pill-wake_up');
      if (wakeLabel) {
        const logged = this.currentLog.wakeTimeLogged;
        if (logged) {
          const wakeEval = this.scoringEngine.evaluateWakeTime(logged, settings.targetWakeTime);
          if (wakeEval.isMet) {
            wakeLabel.innerHTML = `<span style="color: #16a34a; font-weight: 600;">☀️ Woke Up: ${logged} (On Time! +15 pts)</span>`;
            if (wakeCard) wakeCard.classList.add('completed');
            if (wakePill) { wakePill.textContent = '✓ Done'; wakePill.style.color = '#16a34a'; }
          } else {
            wakeLabel.innerHTML = `<span style="color: #e11d48; font-weight: 600;">⏰ Woke Up: ${logged} (${wakeEval.diffMinutes}m Late vs ${settings.targetWakeTime} • 0 pts & -${wakeEval.penalty} penalty)</span>`;
            if (wakeCard) wakeCard.classList.remove('completed');
            if (wakePill) { wakePill.textContent = '○'; wakePill.style.color = '#94a3b8'; }
          }
        } else {
          wakeLabel.innerHTML = `<span style="color: var(--text-secondary);">Target: ${settings.targetWakeTime} • Enter wake-up time</span>`;
          if (wakeCard) wakeCard.classList.remove('completed');
          if (wakePill) { wakePill.textContent = '○'; wakePill.style.color = '#94a3b8'; }
        }
      }

      const sleepLabel = document.getElementById('sleep-status-label');
      const sleepCard = document.getElementById('task-card-sleep_on_time');
      const sleepPill = document.getElementById('time-status-pill-sleep_on_time');
      if (sleepLabel) {
        const logged = this.currentLog.bedTimeLogged;
        if (logged) {
          const sleepEval = this.scoringEngine.evaluateBedTime(logged, settings.targetBedTime);
          if (sleepEval.isMet) {
            sleepLabel.innerHTML = `<span style="color: #16a34a; font-weight: 600;">🌙 Bedtime Saved: ${logged} (On Time! +15 pts)</span>`;
            if (sleepCard) sleepCard.classList.add('completed');
            if (sleepPill) { sleepPill.textContent = '✓ Done'; sleepPill.style.color = '#16a34a'; }
          } else {
            const lateInfo = sleepEval.isPastMidnight ? `Past Midnight / ${sleepEval.diffMinutes}m Late` : `${sleepEval.diffMinutes}m Late vs ${settings.targetBedTime}`;
            sleepLabel.innerHTML = `<span style="color: #e11d48; font-weight: 600;">🌙 Bedtime Saved: ${logged} (${lateInfo} • 0 pts & -${sleepEval.penalty} penalty)</span>`;
            if (sleepCard) sleepCard.classList.remove('completed');
            if (sleepPill) { sleepPill.textContent = '○'; sleepPill.style.color = '#94a3b8'; }
          }
        } else {
          sleepLabel.innerHTML = `<span style="color: var(--text-secondary);">Target: ${settings.targetBedTime} • <i>Recorded automatically upon saving daily log</i></span>`;
          if (sleepCard) sleepCard.classList.remove('completed');
          if (sleepPill) { sleepPill.textContent = '○'; sleepPill.style.color = '#94a3b8'; }
        }
      }

      const profile = this.db.getProfile();
      const targets = this.db.calculateBiometrics(profile);
      const totals = this.db.getDailyNutritionTotals(this.currentDate);

      const proteinPercent = Math.min(100, Math.round((totals.protein / (targets.targetProtein || 1)) * 100));
      const calPercent = Math.min(100, Math.round((totals.calories / (targets.targetCalories || 1)) * 100));

      const pVal = document.getElementById('protein-mini-val');
      const pBar = document.getElementById('protein-mini-bar');
      const cVal = document.getElementById('calorie-mini-val');
      const cBar = document.getElementById('calorie-mini-bar');
      const btnLabel = document.getElementById('nutrition-modal-btn-label');

      if (pVal) pVal.innerHTML = `${totals.protein} / ${targets.targetProtein}g <span style="font-size: 0.72rem; color: var(--text-muted);">(${proteinPercent}%)</span>`;
      if (pBar) pBar.style.width = `${proteinPercent}%`;
      if (cVal) cVal.innerHTML = `${totals.calories} / ${targets.targetCalories} kcal <span style="font-size: 0.72rem; color: var(--text-muted);">(${calPercent}%)</span>`;
      if (cBar) cBar.style.width = `${calPercent}%`;
      if (btnLabel) btnLabel.textContent = `🍽️ Log Meals & Macro Calculator (${totals.mealCount} Logged)`;
    }

    hideValidation() {
      this.validationError = null;
      const box = document.getElementById('validation-alert-box');
      if (box) box.style.display = 'none';
    }

    handleSaveDay() {
      if (!this.currentLog.waterMl || this.currentLog.waterMl <= 0) {
        this.validationError = 'Please select your water intake (e.g. tap 3.0L) before saving!';
        const box = document.getElementById('validation-alert-box');
        const text = document.getElementById('validation-alert-text');
        if (box && text) {
          text.textContent = this.validationError;
          box.style.display = 'flex';
        }
        document.getElementById('task-card-drink_water')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      if (!this.currentLog.wakeTimeLogged) {
        this.validationError = 'Please choose your wake-up time in the Morning section before saving!';
        const box = document.getElementById('validation-alert-box');
        const text = document.getElementById('validation-alert-text');
        if (box && text) {
          text.textContent = this.validationError;
          box.style.display = 'flex';
        }
        document.getElementById('task-card-wake_up')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      // Bedtime is recorded automatically as current exact time upon saving
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      this.currentLog.bedTimeLogged = `${hh}:${mm}`;

      this.hideValidation();
      this.currentLog = this.scoringEngine.evaluateDailyScore(this.currentLog);
      this.currentLog.isSaved = true;
      this.currentLog.savedAt = new Date().toISOString();

      this.db.saveDailyLog(this.currentDate, this.currentLog);
      this.db.saveDraft(this.currentDate, this.currentLog);
      this.db.recalculateLifetimeStats();

      const banner = document.getElementById('today-status-banner');
      const bannerIcon = document.getElementById('save-banner-icon');
      const bannerTitle = document.getElementById('save-banner-title');
      const bannerChip = document.getElementById('save-banner-chip');
      const settingsSaveBtnText = document.getElementById('settings-save-btn-text');

      if (banner) banner.className = 'save-status-banner saved';
      if (bannerIcon) bannerIcon.textContent = '✅';
      if (bannerTitle) bannerTitle.textContent = 'Log Finalized for Today';
      if (bannerChip) { bannerChip.className = 'status-chip active'; bannerChip.textContent = 'Saved'; }
      if (settingsSaveBtnText) settingsSaveBtnText.textContent = "Update & Re-Save Today's Log";

      const successBox = document.getElementById('save-success-box');
      const successText = document.getElementById('save-success-text');
      if (successBox && successText) {
        successText.textContent = `Today's log saved! (Score: ${this.currentLog.totalPoints}/101 pts). Editable anytime before 3:00 AM.`;
        successBox.style.display = 'flex';
        setTimeout(() => { successBox.style.display = 'none'; }, 6000);
      }

      this.feedbackEngine.playDayWonFanfare();
      if (this.currentLog.isWon) {
        triggerConfetti(3000);
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderHistoryArchiveView() {

        <div style="padding: 16px 20px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
            <div>
              <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em;">Daily Logs Archive</div>
              <div style="font-size: 0.76rem; color: var(--text-secondary); margin-top: 1px;">Click on any day to inspect its full log & timestamps</div>
            </div>
            <button type="button" class="btn-timer btn-timer-secondary" id="btn-history-back-today">← Today</button>

                  <div class="archive-day-card" data-archive-date="${dateStr}">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                      <div>
                        <div style="font-weight: 600; font-size: 0.9rem; color: var(--text-primary);">${formattedDate}</div>
                        <div style="font-size: 0.74rem; color: var(--text-secondary); margin-top: 2px;">

                      </div>

                        </span>
