      <text x="12" y="128" fill="#ffffff" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Nitro Cold Brew (Large)</text>
      <text x="215" y="128" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">1</text>
      <text x="265" y="128" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">$5.50</text>
      <text x="348" y="128" fill="#ffffff" font-size="11" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">$5.50</text>
