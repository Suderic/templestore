  <text x="100" y="210" fill="#38bdf8" font-size="28" font-weight="bold" font-family="system-ui">$29<tspan font-size="12" fill="rgba(255, 255, 255, 0.5)">/mo</tspan></text>
  <rect x="100" y="235" width="130" height="6" rx="3" fill="rgba(255, 255, 255, 0.3)"/>
