      <rect width="360" height="24" rx="6" fill="rgba(255, 255, 255, 0.04)"/>
      <text x="12" y="16" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, sans-serif">ITEM DESCRIPTION</text>
      <text x="210" y="16" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, sans-serif">QTY</text>
      <text x="265" y="16" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, sans-serif">RATE</text>
      <text x="348" y="16" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">TOTAL</text>

      <!-- Row 1 -->
      <rect y="30" width="360" height="34" rx="8" fill="rgba(255, 255, 255, 0.02)"/>
      <text x="12" y="52" fill="#ffffff" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Espresso Roast Double</text>
      <text x="215" y="52" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">2</text>
      <text x="265" y="52" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">$3.50</text>
      <text x="348" y="52" fill="#ffffff" font-size="11" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">$7.00</text>

      <!-- Row 2 -->
