      <line x1="120" y1="0" x2="120" y2="28" stroke="#0f172a" stroke-width="2"/>
      <line x1="126" y1="0" x2="126" y2="28" stroke="#0f172a" stroke-width="3"/>
      <line x1="132" y1="0" x2="132" y2="28" stroke="#0f172a" stroke-width="1"/>
      <line x1="136" y1="0" x2="136" y2="28" stroke="#0f172a" stroke-width="2"/>
      <line x1="142" y1="0" x2="142" y2="28" stroke="#0f172a" stroke-width="4"/>
      <line x1="150" y1="0" x2="150" y2="28" stroke="#0f172a" stroke-width="1"/>
      <line x1="154" y1="0" x2="154" y2="28" stroke="#0f172a" stroke-width="2"/>
      <line x1="160" y1="0" x2="160" y2="28" stroke="#0f172a" stroke-width="3"/>
      <line x1="166" y1="0" x2="166" y2="28" stroke="#0f172a" stroke-width="1"/>
      <line x1="170" y1="0" x2="170" y2="28" stroke="#0f172a" stroke-width="2"/>
      <line x1="176" y1="0" x2="176" y2="28" stroke="#0f172a" stroke-width="4"/>
      <line x1="184" y1="0" x2="184" y2="28" stroke="#0f172a" stroke-width="2"/>
