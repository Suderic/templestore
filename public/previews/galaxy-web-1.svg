<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="amberHalo" cx="70%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skyWarm" cx="20%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldButton" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgDark)"/>
  <rect width="1200" height="750" fill="url(#amberHalo)"/>
  <rect width="1200" height="750" fill="url(#skyWarm)"/>

  <!-- Top Announcement Bar -->
  <rect x="0" y="0" width="1200" height="36" fill="#090D1A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="48" y="8" width="84" height="20" rx="10" fill="rgba(245,158,11,0.2)"/>
  <text x="90" y="22" fill="#F59E0B" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">SPRING 2026</text>
  <text x="144" y="22" fill="#E2E8F0" font-size="11" font-family="system-ui, sans-serif" font-weight="500">Curated Atelier Collection • Free White-Glove In-Home Assembly on orders over $150 • 10-Yr Guarantee</text>
  <text x="1152" y="22" fill="#94A3B8" font-size="11" font-family="system-ui, sans-serif" font-weight="500" text-anchor="end">Ateliers: Sydney • Melbourne • Auckland</text>

  <!-- Main Translucent Navbar -->
  <rect x="0" y="36" width="1200" height="68" fill="rgba(15,23,42,0.75)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Logo -->
  <rect x="48" y="48" width="44" height="44" rx="14" fill="#D97706" stroke="#F59E0B" stroke-width="1.5"/>
  <path d="M64 61V58C64 56.3 65.3 55 67 55H73C74.7 55 76 56.3 76 58V61" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <rect x="60" y="61" width="20" height="18" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="70" y="74" fill="#FFFFFF" font-size="11" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">B</text>
  <text x="104" y="66" fill="#FFFFFF" font-size="22" font-family="system-ui, sans-serif" font-weight="900" letter-spacing="1">BUYO</text>
  <circle cx="172" cy="62" r="3.5" fill="#F59E0B"/>
  <text x="104" y="80" fill="#F59E0B" font-size="9" font-family="system-ui, sans-serif" font-weight="800" letter-spacing="3">MODERN LIVING</text>

  <!-- Nav links -->
  <text x="360" y="75" fill="#FFFFFF" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Departments ▾</text>
  <text x="485" y="75" fill="#94A3B8" font-size="13" font-family="system-ui, sans-serif" font-weight="500">Furniture &amp; Seating</text>
  <text x="635" y="75" fill="#94A3B8" font-size="13" font-family="system-ui, sans-serif" font-weight="500">Architectural Lighting</text>
  <text x="805" y="75" fill="#94A3B8" font-size="13" font-family="system-ui, sans-serif" font-weight="500">Audio &amp; Acoustics</text>
  <text x="945" y="75" fill="#94A3B8" font-size="13" font-family="system-ui, sans-serif" font-weight="500">Ceramics</text>

  <!-- Nav Right Actions -->
  <rect x="1035" y="52" width="125" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.1" stroke="rgba(255,255,255,0.2)"/>
  <text x="1097" y="76" fill="#FFFFFF" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Cart ($1,850) • 1</text>

  <!-- Hero Left Column -->
  <rect x="48" y="160" width="235" height="28" rx="14" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.25)"/>
  <circle cx="62" cy="174" r="4" fill="#F59E0B"/>
  <text x="74" y="178" fill="#F59E0B" font-size="11" font-family="system-ui, sans-serif" font-weight="700">CURATED DESIGN ATELIER</text>

  <text x="48" y="245" fill="#FFFFFF" font-size="52" font-family="system-ui, sans-serif" font-weight="900" letter-spacing="-1">Form, Light,</text>
  <text x="48" y="310" fill="#F59E0B" font-size="52" font-family="system-ui, sans-serif" font-weight="900" letter-spacing="-1">&amp; Tactile Living.</text>

  <text x="48" y="365" fill="#94A3B8" font-size="16" font-family="system-ui, sans-serif" font-weight="400">Architectural furniture, sculptural chandeliers, audiophile acoustics,</text>
  <text x="48" y="390" fill="#94A3B8" font-size="16" font-family="system-ui, sans-serif" font-weight="400">and stoneware ceramics handcrafted for serene contemporary spaces.</text>

  <!-- CTA Buttons -->
  <rect x="48" y="430" width="185" height="50" rx="25" fill="url(#goldButton)"/>
  <text x="140" y="461" fill="#020617" font-size="14" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">Explore Catalog →</text>

  <rect x="248" y="430" width="210" height="50" rx="25" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="353" y="461" fill="#FFFFFF" font-size="13" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Ambiance Studio ✦</text>

  <!-- Trust Stats -->
  <line x1="48" y1="530" x2="520" y2="530" stroke="rgba(255,255,255,0.1)"/>
  <text x="48" y="565" fill="#FFFFFF" font-size="24" font-family="system-ui, sans-serif" font-weight="900">10-Year</text>
  <text x="48" y="585" fill="#94A3B8" font-size="11" font-family="system-ui, sans-serif">Craft Guarantee</text>

  <text x="210" y="565" fill="#FFFFFF" font-size="24" font-family="system-ui, sans-serif" font-weight="900">100%</text>
  <text x="210" y="585" fill="#94A3B8" font-size="11" font-family="system-ui, sans-serif">FSC Hardwood</text>

  <text x="380" y="565" fill="#FFFFFF" font-size="24" font-family="system-ui, sans-serif" font-weight="900">White Glove</text>
  <text x="380" y="585" fill="#94A3B8" font-size="11" font-family="system-ui, sans-serif">In-Home Assembly</text>

  <!-- Hero Right: Curated Room Showcase Card -->
  <rect x="680" y="140" width="470" height="550" rx="36" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.15)"/>
  
  <!-- Outer Glow Frame -->
  <rect x="715" y="175" width="400" height="420" rx="28" fill="#0B132B" stroke="#F59E0B" stroke-width="2.5" filter="drop-shadow(0 0 25px rgba(245,158,11,0.45))"/>
  
  <!-- Showcase Mockup Canvas -->
  <rect x="725" y="185" width="380" height="400" rx="22" fill="#0F172A" opacity="0.95"/>
  <circle cx="915" cy="360" r="85" stroke="rgba(245,158,11,0.2)" stroke-width="1.5" fill="none"/>
  <rect x="800" y="320" width="230" height="130" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  
  <!-- Swatch Bar -->
  <rect x="740" y="525" width="350" height="46" rx="20" fill="rgba(2,6,23,0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="760" cy="548" r="7" fill="#F4EBD9" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="780" cy="548" r="7" fill="#292524" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="800" cy="548" r="7" fill="#B45309" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="820" y="552" fill="#FFFFFF" font-size="11" font-family="system-ui, sans-serif" font-weight="700">Koto Lounge Chair • Ivory Bouclé</text>
  <text x="1070" y="552" fill="#F59E0B" font-size="11" font-family="system-ui, sans-serif" font-weight="800" text-anchor="end">$1,850</text>

  <!-- Floating Concierge Widget Icon -->
  <circle cx="1140" cy="700" r="26" fill="#F59E0B"/>
  <text x="1140" y="704" fill="#020617" font-size="11" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">Chat</text>
</svg>
