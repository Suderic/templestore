    <text x="224" y="232" fill="#0f172a" font-size="9" text-anchor="end" font-family="monospace">-$1.70</text>

    <text x="16" y="246" fill="#475569" font-size="9" font-family="monospace">VAT / TAX (13%):</text>
    <text x="224" y="246" fill="#0f172a" font-size="9" text-anchor="end" font-family="monospace">+$1.99</text>

    <line x1="16" y1="256" x2="224" y2="256" stroke="#0f172a" stroke-width="1.5"/>

    <text x="16" y="274" fill="#0f172a" font-size="12" font-weight="900" font-family="monospace">TOTAL AMOUNT:</text>
    <text x="224" y="274" fill="#0f172a" font-size="13" font-weight="900" text-anchor="end" font-family="monospace">$17.29</text>

    <text x="16" y="292" fill="#475569" font-size="9" font-family="monospace">PAYMENT: CASH</text>
    <text x="224" y="292" fill="#475569" font-size="9" text-anchor="end" font-family="monospace">PAID IN FULL</text>

