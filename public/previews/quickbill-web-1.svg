      <text x="12" y="90" fill="#ffffff" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Almond Butter Croissant</text>
      <text x="215" y="90" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">1</text>
      <text x="265" y="90" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">$4.50</text>
      <text x="348" y="90" fill="#ffffff" font-size="11" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">$4.50</text>

